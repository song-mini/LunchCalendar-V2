# (브랜치 전용 임시 변경) Render 배포 URL 진단 — 확인 후 원복
name: keepalive

on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 후보 URL 프로브
        run: |
          for name in lunch-calendar-v2 lunchcalendar-v2 lunch-calendar lunchcalendar \
                      lunch-calendar-v2-1 lunchcalendar-v2-1 gtl-calendar team-gtl-calendar \
                      gtl-lunch-calendar gtl-lunch teamgtl gtl-cal lunch-cal gtl; do
            code=$(curl -s --max-time 90 -o /dev/null -w '%{http_code}' "https://${name}.onrender.com/healthz" || echo ERR)
            routing=$(curl -s --max-time 20 -D - -o /dev/null "https://${name}.onrender.com/" | grep -i 'x-render-routing' | tr -d '\r' || true)
            echo "${name} -> healthz=${code} ${routing}"
          done

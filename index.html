<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1612" media="(prefers-color-scheme: dark)">
<title>팀 GTL · 캘린더 2026</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: light dark;

    /* easings — smoother across the board */
    --ease-out:  cubic-bezier(.22, 1, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
    --dur-fast: .18s;
    --dur:      .28s;
    --dur-slow: .55s;

    --bg:#f4f2ed;
    --bg-2:#ede8df;
    --surface:rgba(255,255,255,.86);
    --surface-solid:#fff;
    --surface-2:#f7f4ef;
    --surface-3:#efebe4;
    --bd:rgba(28,25,23,.08);
    --bd-strong:rgba(28,25,23,.16);
    --text:#1f1b18;
    --text-2:#5f5852;
    --text-3:#7c736a;

    --teal:#0f6c58;
    --teal-2:#1a8a68;
    --teal-3:#e9f7f1;
    --teal-glow: rgba(15,108,88,.18);
    --coral:#c2410c;
    --coral-2:#fff5eb;

    --sat:#2563eb;
    --sun:#dc2626;

    --hol-bg:#fff1f3; --hol-bd:#f6c7cf; --hol-t:#b4234f;
    --off-bg:#fff8e7; --off-bd:#f2d28b; --off-t:#9a5b11;
    --wk-bg:#eef5ff;  --wk-bd:#c2d9ff;
    --today-bg:#eefaf5;

    --shadow:0 18px 42px rgba(30,24,20,.08);
    --shadow-soft:0 8px 22px rgba(30,24,20,.06);
    --shadow-lift:0 16px 30px rgba(30,24,20,.10);
    --shadow-modal:0 28px 60px rgba(16,12,10,.18);

    --page-bg:
      radial-gradient(1000px 500px at 15% -10%, rgba(15,108,88,.11), transparent 56%),
      radial-gradient(800px 500px at 95% 8%, rgba(194,65,12,.08), transparent 50%),
      linear-gradient(180deg, #f7f4ef 0%, var(--bg) 52%, #f2eee7 100%);

    --hero-bg:
      linear-gradient(135deg, rgba(15,108,88,.06) 0%, rgba(194,65,12,.04) 100%),
      linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.88));

    --ff:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  }

  [data-theme="dark"] {
    --bg:#1a1612;
    --bg-2:#221d18;
    --surface:rgba(38,32,27,.72);
    --surface-solid:#2a2421;
    --surface-2:#332b26;
    --surface-3:#3d342e;
    --bd:rgba(255,245,235,.08);
    --bd-strong:rgba(255,245,235,.18);
    --text:#f4ede5;
    --text-2:#b0a499;
    --text-3:#7a6f66;

    --teal:#3eaa8a;
    --teal-2:#52c6a0;
    --teal-3:rgba(62,170,138,.14);
    --teal-glow: rgba(62,170,138,.24);
    --coral:#ff8a55;
    --coral-2:rgba(255,138,85,.14);

    --sat:#5a8fff;
    --sun:#ff6b6b;

    --hol-bg:rgba(255,107,107,.10); --hol-bd:rgba(255,107,107,.28); --hol-t:#ff8e8e;
    --off-bg:rgba(255,191,75,.08);  --off-bd:rgba(255,191,75,.26);  --off-t:#e8b65a;
    --wk-bg:rgba(90,143,255,.07);   --wk-bd:rgba(90,143,255,.22);
    --today-bg:rgba(62,170,138,.14);

    --shadow:0 18px 42px rgba(0,0,0,.45);
    --shadow-soft:0 8px 22px rgba(0,0,0,.28);
    --shadow-lift:0 16px 30px rgba(0,0,0,.40);
    --shadow-modal:0 28px 60px rgba(0,0,0,.55);

    --page-bg:
      radial-gradient(1000px 500px at 15% -10%, rgba(62,170,138,.10), transparent 56%),
      radial-gradient(800px 500px at 95% 8%, rgba(255,138,85,.07), transparent 50%),
      linear-gradient(180deg, #1f1a16 0%, var(--bg) 52%, #181410 100%);

    --hero-bg:
      linear-gradient(135deg, rgba(62,170,138,.10) 0%, rgba(255,138,85,.06) 100%),
      linear-gradient(180deg, rgba(50,42,36,.65), rgba(40,34,29,.55));
  }

  html, body { height: 100%; }
  body{
    font-family:var(--ff);
    background: var(--page-bg);
    color:var(--text);
    min-height:100vh;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background-color .6s var(--ease-out), color .4s var(--ease-out);
  }

  *:focus-visible{ outline: 3px solid var(--teal-glow); outline-offset: 2px; }

  /* === unified animations === */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn  { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes popOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(6px) scale(.97); } }
  @keyframes monthSlideRight { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes monthSlideLeft  { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes sync-pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  @keyframes dice-roll {
    0%   { transform: rotate(0deg)   scale(1);   }
    20%  { transform: rotate(-90deg) scale(1.15); }
    40%  { transform: rotate(180deg) scale(1.2);  }
    60%  { transform: rotate(360deg) scale(1.15); }
    80%  { transform: rotate(540deg) scale(1.1);  }
    100% { transform: rotate(720deg) scale(1);    }
  }
  @keyframes spotlight {
    0%   { transform: scale(.94); box-shadow: 0 0 0 0 var(--teal-glow); }
    50%  { transform: scale(1.02); box-shadow: 0 0 0 18px transparent; }
    100% { transform: scale(1);    box-shadow: 0 0 0 0 transparent; }
  }
  @keyframes dice-winner {
    0%   { transform: scale(1);    box-shadow: 0 0 0 0 var(--teal-glow); }
    25%  { transform: scale(1.05); box-shadow: 0 0 0 14px var(--teal-glow); }
    50%  { transform: scale(.99);  box-shadow: 0 0 0 24px transparent; }
    75%  { transform: scale(1.02); box-shadow: 0 0 0 10px var(--teal-glow); }
    100% { transform: scale(1);    box-shadow: 0 0 0 0 transparent; }
  }
  @keyframes flash-ring {
    0%   { box-shadow: 0 0 0 0 var(--teal-glow), 0 0 0 0 var(--teal); }
    40%  { box-shadow: 0 0 0 6px var(--teal-glow), 0 0 0 2px var(--teal); }
    100% { box-shadow: 0 0 0 0 transparent, 0 0 0 0 transparent; }
  }
  @keyframes vote-pop {
    0%   { transform: scale(1) rotate(0deg); }
    30%  { transform: scale(1.45) rotate(-12deg); }
    60%  { transform: scale(.92) rotate(8deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes count-bump {
    0%   { transform: translateY(0); }
    40%  { transform: translateY(-4px); }
    100% { transform: translateY(0); }
  }
  @keyframes row-collapse {
    0%   { opacity: 1; max-height: 200px; transform: translateX(0); margin-bottom: var(--row-mb, 7px); padding-top: var(--row-pt, 10px); padding-bottom: var(--row-pb, 10px); }
    40%  { opacity: 0; transform: translateX(28px); max-height: 200px; }
    100% { opacity: 0; transform: translateX(28px); max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-width: 0; }
  }
  @keyframes chip-collapse {
    0%   { opacity: 1; max-height: 40px; transform: scale(1); }
    100% { opacity: 0; max-height: 0; transform: scale(.9); margin: 0; padding-top: 0; padding-bottom: 0; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .page{ max-width: 1280px; margin: 0 auto; padding: 1.1rem 1.25rem 1.6rem; }

  /* === topbar === */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap: 12px; flex-wrap:wrap; margin-bottom: .9rem;
    animation: fadeUp .45s var(--ease-out);
  }
  .brand{ display:flex; align-items:center; gap: 12px; min-width: 0; }
  .brand-icon{
    width: 42px; height: 42px; border-radius: 14px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size: 13px; font-weight: 800; letter-spacing: .2px;
    background: linear-gradient(135deg, var(--teal) 0%, #146f5a 42%, #1b8f6d 100%);
    box-shadow: 0 10px 20px var(--teal-glow);
    cursor: pointer; user-select: none; border: 0;
    transition: transform .25s var(--ease-spring), box-shadow .2s var(--ease-out);
  }
  .brand-icon:hover { transform: rotate(-4deg) scale(1.04); box-shadow: 0 14px 26px var(--teal-glow); }
  .brand-icon:active { transform: scale(.96); }
  .brand-text .name{ font-size: 18px; font-weight: 800; letter-spacing: -.4px; color: var(--text); }
  .brand-text .sub{ margin-top: 2px; font-size: 12px; color: var(--text-3); }

  .topbar-right{ display:flex; align-items:center; gap: 8px; flex-wrap:wrap; }

  .month-ctrl{
    display:flex; align-items:center; gap: 4px;
    background: var(--surface); border: 1px solid var(--bd);
    border-radius: 16px; padding: 5px;
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .nav-btn{
    width: 32px; height: 32px; border: 0; border-radius: 10px;
    background: transparent; cursor: pointer; color: var(--text-2);
    display:flex; align-items:center; justify-content:center;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .nav-btn:hover{ background: var(--surface-2); color: var(--text); transform: translateY(-1px); }
  .nav-btn:active { transform: scale(.92); }
  .nav-btn:disabled { opacity: .35; cursor: default; transform: none; }
  .month-label{
    min-width: 118px; text-align:center;
    font-size: 14px; font-weight: 700; letter-spacing: -.2px;
    color: var(--text); padding: 0 .25rem; white-space: nowrap;
    transition: opacity .2s var(--ease-out);
  }

  .today-btn {
    display:flex; align-items:center; gap: 6px;
    height: 36px; padding: 0 14px;
    border: 1px solid var(--bd); border-radius: 12px;
    background: var(--surface); color: var(--text);
    font-family: var(--ff); font-size: 12.5px; font-weight: 700;
    cursor: pointer; box-shadow: var(--shadow-soft);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: all var(--dur-fast) var(--ease-out);
  }
  .today-btn:hover { background: var(--surface-2); border-color: var(--bd-strong); transform: translateY(-1px); }
  .today-btn:active { transform: scale(.96); }
  .today-btn i { font-size: 14px; color: var(--teal); }

  .sync-pill{
    display:flex; align-items:center; gap: 7px;
    padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--bd); background: var(--surface);
    box-shadow: var(--shadow-soft); color: var(--text-2);
    font-size: 12px; white-space:nowrap;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: all var(--dur-fast) var(--ease-out);
  }
  .sync-dot{ width: 8px; height: 8px; border-radius: 999px; background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.12); transition: background .3s; }
  .sync-dot.saving{ background:#f59e0b; box-shadow: 0 0 0 4px rgba(245,158,11,.14); animation: sync-pulse 1.8s var(--ease-out) infinite; }
  .sync-dot.error { background:#ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,.14); }

  .icon-btn{
    width: 36px; height: 36px; border: 1px solid var(--bd); border-radius: 12px;
    background: var(--surface); cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-2); box-shadow: var(--shadow-soft);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .icon-btn:hover{ background: var(--surface-2); border-color: var(--bd-strong); color: var(--text); transform: translateY(-1px); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn .ti { transition: transform .4s var(--ease-spring); }
  .theme-btn:hover .ti { transform: rotate(180deg); }

  /* === today hero === */
  .today-hero{
    position: relative;
    border-radius: 22px;
    border: 1px solid var(--bd);
    background: var(--hero-bg);
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 22px 24px 20px;
    margin-bottom: .9rem;
    overflow: hidden;
    animation: fadeUp .55s var(--ease-out) .04s both;
  }
  .today-hero::before {
    content: '';
    position: absolute;
    top: -40%; right: -10%; width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--teal-glow), transparent 60%);
    pointer-events: none;
    opacity: .8;
  }
  .hero-head {
    display:flex; align-items:flex-end; justify-content:space-between; gap: 18px;
    margin-bottom: 16px; position: relative;
  }
  .hero-title-wrap { min-width: 0; }
  .hero-title { font-size: 26px; font-weight: 800; letter-spacing: -.8px; color: var(--text); line-height: 1.1; }
  .hero-sub { margin-top: 6px; font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hero-sub b { font-weight: 700; color: var(--text); }
  .hero-count-pill { display:inline-flex; align-items: center; gap:5px; padding: 3px 10px; border-radius: 999px; background: var(--teal-3); color: var(--teal); font-weight: 700; font-size: 11.5px; }

  .hero-actions { display:flex; align-items:center; gap: 8px; flex-shrink: 0; }
  .dice-btn{
    display:flex; align-items:center; gap: 8px;
    padding: 11px 18px; border-radius: 14px;
    border: 0; color: #fff; font-family: var(--ff); font-size: 14px; font-weight: 700;
    background: linear-gradient(135deg, var(--teal) 0%, #0d7a61 100%);
    box-shadow: 0 12px 24px var(--teal-glow);
    cursor: pointer; position: relative; overflow: hidden;
    transition: all var(--dur-fast) var(--ease-out);
  }
  .dice-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 30px var(--teal-glow); }
  .dice-btn:active { transform: translateY(0) scale(.97); }
  .dice-btn .dice { font-size: 18px; display: inline-block; }
  .dice-btn.rolling .dice { animation: dice-roll .9s var(--ease-spring); }
  .add-btn-ghost {
    display:flex; align-items:center; gap: 6px;
    padding: 11px 16px; border-radius: 14px;
    border: 1px solid var(--bd-strong); background: var(--surface);
    color: var(--text); font-family: var(--ff); font-size: 13px; font-weight: 600;
    cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: all var(--dur-fast) var(--ease-out);
  }
  .add-btn-ghost:hover { background: var(--surface-2); border-color: var(--text-2); transform: translateY(-1px); }
  .add-btn-ghost:active { transform: scale(.96); }

  .hero-list { display: flex; flex-direction: column; gap: 8px; position: relative; }
  .hero-row {
    display:flex; align-items:center; gap: 12px;
    padding: 12px 14px; border-radius: 14px;
    background: var(--surface-solid); border: 1px solid var(--bd);
    box-shadow: 0 2px 8px rgba(30,24,20,.04);
    cursor: pointer;
    opacity: 1;
    transition: all var(--dur-fast) var(--ease-out);
  }
  .hero-row.enter { animation: fadeUp .4s var(--ease-out) both; }
  [data-theme="dark"] .hero-row {
    background: var(--surface-3);
    border-color: var(--bd);
    box-shadow: 0 2px 10px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.04);
  }
  [data-theme="dark"] .hero-row:hover {
    background: var(--surface-3);
    border-color: var(--bd-strong);
    box-shadow: 0 10px 22px rgba(0,0,0,.4);
  }
  .hero-row:hover { transform: translateY(-2px); border-color: var(--bd-strong); box-shadow: 0 10px 22px rgba(30,24,20,.08); }
  .hero-row.spotlight { animation: spotlight 1.4s var(--ease-spring); border-color: var(--teal); }

  .hero-rank { width: 28px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }
  .hero-rank.r0 { background: linear-gradient(135deg, #f5cb5c, #d4a429); color: #fff; box-shadow: 0 4px 10px rgba(212,164,41,.4); }
  .hero-rank.r1 { background: var(--surface-3); color: var(--text-2); }
  .hero-rank.r2 { background: var(--surface-3); color: var(--text-2); }
  .hero-rank.rN { background: transparent; color: var(--text-3); font-weight: 600; }

  .hero-name-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hero-name { font-size: 14.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-memo { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .hero-vote {
    display:inline-flex; align-items:center; gap: 5px;
    padding: 7px 13px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--bd);
    color: var(--text-2); font-family: var(--ff); font-size: 13px; font-weight: 700;
    cursor: pointer; flex-shrink: 0;
    transition: all var(--dur-fast) var(--ease-out);
  }
  .hero-vote:hover { border-color: var(--bd-strong); transform: translateY(-1px); }
  .hero-vote:active { transform: scale(.93); }
  .hero-vote.voted { background: var(--coral-2); border-color: var(--coral); color: var(--coral); }
  .hero-vote i { font-size: 14px; transition: transform .3s var(--ease-spring); }
  .hero-vote:hover i { transform: scale(1.15) rotate(-8deg); }

  .hero-empty {
    text-align: center; padding: 24px 16px 18px;
    color: var(--text-3); font-size: 14px;
  }
  .hero-empty i { display:block; font-size: 32px; opacity: .35; margin-bottom: 10px; }

  /* === tabs === */
  .tabs-wrap{
    display:flex; gap: 4px; flex-wrap:wrap; padding: 6px;
    margin-bottom: .9rem; border-radius: 18px;
    border: 1px solid var(--bd); background: var(--surface);
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    animation: fadeUp .5s var(--ease-out) .08s both;
  }
  .tab{
    flex: 1 1 0; min-width: 56px; border: 0; border-radius: 12px;
    background: transparent; color: var(--text-2);
    font-family: var(--ff); font-size: 13px; font-weight: 600;
    padding: 10px 10px; cursor: pointer;
    transition: all var(--dur-fast) var(--ease-out);
    position: relative; white-space: nowrap;
  }
  .tab:hover{ background: var(--surface-2); color: var(--text); }
  .tab.active{
    background: var(--teal);
    color: #fff; box-shadow: 0 4px 10px var(--teal-glow);
  }
  .tab.has-data::after{
    content:''; position:absolute; top: 6px; right: 8px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--coral);
  }
  .tab.active.has-data::after { background: rgba(255,255,255,.7); }

  /* === calendar (smoother) === */
  .cal{
    display:grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;
    animation: fadeUp .55s var(--ease-out) .12s both;
  }
  .cal.slide-r { animation: monthSlideRight .34s var(--ease-out); }
  .cal.slide-l { animation: monthSlideLeft  .34s var(--ease-out); }

  .dow{ padding: 4px 2px 8px; text-align:center; font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--text-3); }
  .dow.sun{ color: var(--sun); }
  .dow.sat{ color: var(--sat); }

  .cell{
    min-height: 118px; padding: 10px 10px 9px;
    border-radius: 16px; border: 1px solid var(--bd);
    background: var(--surface); box-shadow: var(--shadow-soft);
    display:flex; flex-direction:column; gap: 4px;
    cursor:pointer;
    transition: border-color .22s var(--ease-out), background-color .22s var(--ease-out);
  }
  .cal.mounting .cell {
    animation: popIn .4s var(--ease-out) both;
    animation-delay: calc(var(--cell-i, 0) * 14ms);
  }
  .cell:hover{ border-color: rgba(15,108,88,.32); }
  [data-theme="dark"] .cell:hover { border-color: rgba(62,170,138,.42); }
  .cell.empty{ background: transparent; box-shadow: none; border: none; min-height: 48px; pointer-events: none; padding: 0; animation: none; }
  .cell.wknd{ background: linear-gradient(180deg, var(--wk-bg) 0%, var(--surface) 100%); border-color: var(--wk-bd); }

<script>
/* =================================================================
   팀 GTL 캘린더 v3 — Supabase + Today hero + Dark mode
================================================================== */

const YEAR = 2026;
const MONTHS = [5,6,7,8,9,10,11,12];
const MN = { 5:'5월',6:'6월',7:'7월',8:'8월',9:'9월',10:'10월',11:'11월',12:'12월' };
const DOW_KR = ['일','월','화','수','목','금','토'];

const YEAR_HOLIDAYS = {
  2026: {
    '1-1':'신정',
    '2-16':'설날 연휴','2-17':'설날','2-18':'설날 연휴',
    '3-1':'삼일절','3-2':'삼일절 대체공휴일',
    '5-5':'어린이날','5-24':'부처님오신날','5-25':'부처님오신날 대체공휴일',
    '6-3':'지방선거일','6-6':'현충일',
    '7-17':'제헌절',
    '8-15':'광복절','8-17':'광복절 대체공휴일',
    '9-24':'추석 연휴','9-25':'추석','9-26':'추석 연휴',
    '10-3':'개천절','10-5':'개천절 대체공휴일','10-9':'한글날',
    '12-25':'크리스마스'
  }
};
const HERO_HIDE_HOUR = 13;  // 13시 이후 히어로 숨김

let cur = (() => {
  const m = new Date().getMonth() + 1;
  return MONTHS.includes(m) ? m : 5;
})();
let D = {};
MONTHS.forEach(m => { D[m] = {}; });

let openDay = null, helpOpen = false, es = null;
let sb = null, MY_VOTER_ID = '';
let _loaded = false;          // turns true after first loadAll() resolves
let _editingId = null;        // entry id currently in edit mode in modal
let _editDraft = { name:'', memo:'' };

/* ---------- helpers ---------- */
function getHolidayName(y,m,d){ return (YEAR_HOLIDAYS[y]||{})[m+'-'+d] || null; }
function lastFri(y,m){ let d=new Date(y,m,0); while(d.getDay()!==5) d.setDate(d.getDate()-1); return d.getDate(); }
function hasDat(m){ return Object.values(D[m]||{}).some(v => (v.entries||[]).length>0); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ensureDay(m,d){ if(!D[m][d]) D[m][d]={entries:[]}; return D[m][d]; }
function findEntry(id){
  for(const m of MONTHS){
    for(const d of Object.keys(D[m]||{})){
      const idx = D[m][d].entries.findIndex(e => e.id===id);
      if(idx>=0) return { m:+m, d:+d, idx, entry: D[m][d].entries[idx] };
    }
  }
  return null;
}
function getOrMakeVoterId(){
  let id=''; try{ id = localStorage.getItem('gtl-voter-id') || ''; }catch(e){}
  if(!id){
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
         'v-'+Math.random().toString(36).slice(2)+'-'+Date.now();
    try{ localStorage.setItem('gtl-voter-id', id); }catch(e){}
  }
  return id;
}

/* ---------- toast & confirm ---------- */
function showToast(msg, type){
  const wrap = document.getElementById('tw');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  const icon = type==='err' ? 'ti-alert-circle' : type==='ok' ? 'ti-check' : 'ti-info-circle';
  el.innerHTML = '<i class="ti '+icon+'"></i><span></span>';
  el.querySelector('span').textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('leave');
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }, 2600);
}

let _confirmResolve = null;
function showConfirm(msg, confirmLabel){
  return new Promise(resolve => {
    _confirmResolve = resolve;
    const cw = document.getElementById('cw');
    cw.innerHTML = `
      <div class="backdrop confirm-wrap" onclick="resolveConfirm(event,this,false)">
        <div class="modal modal-sm" onclick="event.stopPropagation()" role="alertdialog" aria-modal="true">
          <div class="ctitle"></div>
          <div class="mbtns">
            <button class="btn btn-ghost" type="button" onclick="resolveConfirm(null,null,false)">취소</button>
            <button class="btn btn-primary" type="button" onclick="resolveConfirm(null,null,true)"></button>
          </div>
        </div>
      </div>`;
    cw.querySelector('.ctitle').textContent = msg;
    cw.querySelector('.btn-primary').textContent = confirmLabel || '확인';
  });
}
function resolveConfirm(ev, ov, val){
  if(ev && ov && ev.target !== ov) return;
  const cw = document.getElementById('cw');
  const bd = cw.querySelector('.backdrop');
  if(!bd){ if(_confirmResolve){ _confirmResolve(val); _confirmResolve=null; } return; }
  bd.classList.add('closing');
  setTimeout(() => {
    cw.innerHTML = '';
    if(_confirmResolve){ _confirmResolve(val); _confirmResolve=null; }
  }, 180);
}

function setSyncState(state){
  const dot=document.getElementById('syncDot'), txt=document.getElementById('syncText');
  if(!dot||!txt) return;

}

async function loadAll(){
  setSyncState('load');
  MONTHS.forEach(m=>{ D[m]={}; });

  const { data: entries, error: e1 } = await sb.from('entries')
    .select('id,year,month,day,name,memo').eq('year', YEAR);
  if(e1){ setSyncState('err'); console.error(e1); return; }

  const ids = entries.map(e=>e.id);
  let votes=[];
  if(ids.length){
    const { data: vrows, error: e2 } = await sb.from('votes')
      .select('entry_id,voter_id').in('entry_id', ids);
    if(e2){ setSyncState('err'); console.error(e2); return; }
    votes = vrows;
  }

  const byEntry={};
  votes.forEach(v => (byEntry[v.entry_id] = byEntry[v.entry_id]||new Set()).add(v.voter_id));

  entries.forEach(e=>{
    if(!MONTHS.includes(e.month)) return;
    ensureDay(e.month, e.day).entries.push({
      id:e.id, name:e.name, memo:e.memo||'',
      voters: byEntry[e.id] || new Set()
    });
  });
  MONTHS.forEach(m => Object.keys(D[m]).forEach(d => D[m][d].entries.sort((a,b)=>a.id-b.id)));

  _loaded = true;
  setSyncState('ok');
  rerender(true);
}

function subscribe(){
  sb.channel('gtl-lunch')
    .on('postgres_changes',{event:'*',schema:'public',table:'entries'}, onEntryChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'votes'},   onVoteChange)
    .subscribe();
}
function flashEntry(id){
  requestAnimationFrame(() => {
    document.querySelectorAll(
      '[data-eid="'+id+'"], [data-entry-id="'+id+'"]'
    ).forEach(el => {
      el.classList.remove('flash');
      // force reflow so re-adding restarts the animation
      void el.offsetWidth;
      el.classList.add('flash');
      el.addEventListener('animationend', () => el.classList.remove('flash'), { once: true });
    });
  });
}

function onEntryChange(p){
  const eN=p.new, eO=p.old;
  if(p.eventType==='INSERT'){
    if(!MONTHS.includes(eN.month) || eN.year!==YEAR) return;
    if(findEntry(eN.id)) return;
    ensureDay(eN.month, eN.day).entries.push({
      id:eN.id, name:eN.name, memo:eN.memo||'', voters:new Set()
    });
    D[eN.month][eN.day].entries.sort((a,b)=>a.id-b.id);
    rerender();
    if(eN.created_by !== MY_VOTER_ID) flashEntry(eN.id);
  } else if(p.eventType==='UPDATE'){
    if(!MONTHS.includes(eN.month) || eN.year!==YEAR) return;
    const f = findEntry(eN.id); if(!f){ rerender(); return; }
    f.entry.name = eN.name;
    f.entry.memo = eN.memo || '';
    rerender();
    if(eN.created_by !== MY_VOTER_ID) flashEntry(eN.id);
  } else if(p.eventType==='DELETE'){
    const f=findEntry(eO.id); if(f) D[f.m][f.d].entries.splice(f.idx,1);
    rerender();
  }
}
function onVoteChange(p){
  const v = p.eventType==='DELETE' ? p.old : p.new;
  const f = findEntry(v.entry_id); if(!f) return;
  if(p.eventType==='INSERT') f.entry.voters.add(v.voter_id);
  else if(p.eventType==='DELETE') f.entry.voters.delete(v.voter_id);
  rerender();
  if(v.voter_id !== MY_VOTER_ID) flashEntry(v.entry_id);
}

/* ---------- mutations ---------- */
function normalizeName(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function getAllRestaurantNames(){
  const set = new Set();
  MONTHS.forEach(m => Object.values(D[m]||{}).forEach(d =>
    (d.entries||[]).forEach(e => { if(e.name) set.add(e.name); })
  ));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'ko'));
}
function isDuplicateOnDay(day, name, ignoreId){
  const list = (D[cur] && D[cur][day] && D[cur][day].entries) || [];
  const norm = normalizeName(name);
  return list.some(e => e.id !== ignoreId && normalizeName(e.name) === norm);
}

async function addEntryAsync(day, name, memo){
  setSyncState('sv');
  const { error } = await sb.from('entries').insert({
    year:YEAR, month:cur, day, name, memo:memo||'', created_by:MY_VOTER_ID
  });
  setSyncState(error?'err':'ok');
  if(error){ showToast('저장 실패: '+error.message, 'err'); return false; }
  return true;
}
async function updateEntryAsync(entryId, name, memo){
  const f = findEntry(entryId);
  let backup=null;
  if(f){ backup = { name:f.entry.name, memo:f.entry.memo }; f.entry.name=name; f.entry.memo=memo||''; rerender(); }
  setSyncState('sv');
  const { error } = await sb.from('entries').update({ name, memo: memo||'' }).eq('id', entryId);
  if(error){
    if(f && backup){ f.entry.name=backup.name; f.entry.memo=backup.memo; rerender(); }
    setSyncState('err'); showToast('수정 실패: '+error.message, 'err'); return false;
  }
  setSyncState('ok');
  return true;
}
async function deleteEntryAsync(entryId){
  // animate out first so the row collapses instead of vanishing
  const els = document.querySelectorAll(
    '[data-eid="'+entryId+'"], [data-entry-id="'+entryId+'"]'
  );
  els.forEach(el => el.classList.add('removing'));
  if(els.length){ await new Promise(r => setTimeout(r, 240)); }

  const f = findEntry(entryId);
  let restore=null;
  if(f){ restore={m:f.m,d:f.d,idx:f.idx,entry:f.entry}; D[f.m][f.d].entries.splice(f.idx,1); rerender(); }
  setSyncState('sv');
  const { error } = await sb.from('entries').delete().eq('id', entryId);
  if(error){
    if(restore) D[restore.m][restore.d].entries.splice(restore.idx, 0, restore.entry);
    rerender(); setSyncState('err'); showToast('삭제 실패: '+error.message, 'err'); return;
  }
  setSyncState('ok');
}
const _votingIds = new Set();
function _animateVote(entryId, becameVoted){
  if(becameVoted && navigator.vibrate){ try { navigator.vibrate(10); } catch(e){} }
  requestAnimationFrame(() => {
    document.querySelectorAll(
      '[data-eid="'+entryId+'"] .evote, [data-entry-id="'+entryId+'"] .hero-vote'
    ).forEach(btn => {
      btn.classList.remove('popping','bumping');
      void btn.offsetWidth;
      btn.classList.add('popping','bumping');
      btn.addEventListener('animationend', () => btn.classList.remove('popping','bumping'), { once: true });
    });
  });
}
async function toggleVoteAsync(entryId){
  if(_votingIds.has(entryId)) return;
  _votingIds.add(entryId);
  try{
    const f = findEntry(entryId); if(!f) return;
    const was = f.entry.voters.has(MY_VOTER_ID);
    if(was) f.entry.voters.delete(MY_VOTER_ID); else f.entry.voters.add(MY_VOTER_ID);
    rerender();
    _animateVote(entryId, !was);
    setSyncState('sv');
    const { error } = was
      ? await sb.from('votes').delete().eq('entry_id', entryId).eq('voter_id', MY_VOTER_ID)
      : await sb.from('votes').insert({ entry_id: entryId, voter_id: MY_VOTER_ID });
    if(error){
      if(was) f.entry.voters.add(MY_VOTER_ID); else f.entry.voters.delete(MY_VOTER_ID);
      rerender(); setSyncState('err'); showToast('투표 처리 실패', 'err'); return;
    }
    setSyncState('ok');
  } finally {
    _votingIds.delete(entryId);
  }
}

  const now = new Date();
  return {
    y: now.getFullYear(),
    m: now.getMonth()+1,
    d: now.getDate(),
    hour: now.getHours(),
    dow: DOW_KR[now.getDay()]
  };
}
function isTodaysMonth(){
  const t = todayInfo();
  return t.y===YEAR && t.m===cur;
}
function shouldShowHero(){
  const t = todayInfo();
  // Only show on today's month + before HERO_HIDE_HOUR
  if(!isTodaysMonth()) return false;
  if(t.hour >= HERO_HIDE_HOUR) return false;
  return true;
}
function getTodayEntries(){
  const t = todayInfo();
  if(t.y!==YEAR || !MONTHS.includes(t.m)) return [];
  const day = D[t.m] && D[t.m][t.d];
  if(!day) return [];
  // sort by votes desc, then by id asc
  return day.entries.slice().sort((a,b) => (b.voters.size - a.voters.size) || (a.id - b.id));
}

function renderHero(){

    <div class="hero-head">
      <div class="hero-title-wrap">
        <div class="hero-title">오늘 뭐 먹지?</div>
        <div class="hero-sub">
          <b>${YEAR}년 ${MN[t.m]} ${t.d}일 (${t.dow})</b>
          ${count>0 ? '<span class="hero-count-pill"><i class="ti ti-flame" style="font-size:11px"></i>후보 '+count+'</span>' : ''}
        </div>
      </div>
      <div class="hero-actions">
        ${count>=2 ? '<button class="dice-btn" id="diceBtn" type="button" onclick="rollDice()" aria-label="랜덤 추첨"><span class="dice">🎲</span>골라줘</button>' : ''}
        <button class="add-btn-ghost" type="button" onclick="openModalForToday(${t.d})">

function openModalForToday(day){
  const t = todayInfo();
  if(t.m !== cur) sw(t.m);
  openModal(day);
}

function rollDice(){
  const entries = getTodayEntries();
  if(entries.length < 2) return;
  const btn = document.getElementById('diceBtn');
  if(btn){ btn.classList.add('rolling'); btn.disabled = true; }
  const list = document.getElementById('heroList');
  if(!list) return;

  const weights = entries.map(e => (e.voters.size||0) + 1);
  const sum = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*sum;
  let pickIdx = 0;
  for(let i=0;i<weights.length;i++){ r -= weights[i]; if(r<=0){ pickIdx=i; break; } }

  // Phase 1: dice rolls solo (~900ms). Phase 2: shuffle-spotlight, then settle on pick.
  setTimeout(() => {
    if(btn){ btn.classList.remove('rolling'); btn.disabled = false; }
    const rows = list.querySelectorAll('.hero-row');
    if(!rows.length) return;
    let i = 0;
    const shuffleCount = 8;
    const id = setInterval(() => {
      rows.forEach(r => r.classList.remove('spotlight'));
      rows[i % rows.length].classList.add('spotlight');
      i++;
      if(i >= shuffleCount){
        clearInterval(id);
        rows.forEach(r => r.classList.remove('spotlight','dice-winner'));
        const winner = rows[pickIdx];
        winner.classList.add('dice-winner');
        winner.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        if(navigator.vibrate){ try { navigator.vibrate([12, 60, 18]); } catch(e){} }
        winner.addEventListener('animationend', () => winner.classList.remove('dice-winner'), { once: true });
      }
    }, 80);
  }, 900);
}

/* ---------- jump to today ---------- */
function jumpToToday(){
  const t = todayInfo();
  if(t.y!==YEAR || !MONTHS.includes(t.m)){
    // outside the calendar's range — just bounce
    return;
  }
  if(t.m !== cur) sw(t.m);
  // gentle scroll to today cell on small screens
  setTimeout(() => {
    const cells = document.querySelectorAll('.cell.today');
    if(cells[0]){
      cells[0].style.transition = 'transform .35s cubic-bezier(.34,1.56,.64,1)';
      cells[0].animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }],
        { duration: 550, easing: 'cubic-bezier(.34,1.56,.64,1)' }
      );
    }
  }, 250);
}

function sw(m){
  if(!MONTHS.includes(m) || m===cur) return;
  const prev = cur;

  renderTabs();

  g.classList.add(m > prev ? 'slide-r' : 'slide-l');

function changeMonth(delta){

function render(animate){
  document.getElementById('monthTitle').textContent='2026년 '+MN[cur];

  const g=document.getElementById('calGrid');
  g.classList.remove('mounting');
  g.innerHTML='';
  if(animate){
    g.classList.add('mounting');
    setTimeout(()=> g.classList.remove('mounting'), 700);
  }

  DOW_KR.forEach((d,i)=>{
    const el=document.createElement('div');
    el.className='dow'+(i===0?' sun':i===6?' sat':'');
    el.textContent=d;
    g.appendChild(el);
  });

  if(!_loaded){
    // skeleton grid while initial data loads
    for(let i=0;i<35;i++){
      const sk = document.createElement('div');
      sk.className = 'cell skeleton';
      g.appendChild(sk);
    }
    document.getElementById('notice').textContent = '';
    return;
  }

  const firstDay=new Date(YEAR,cur-1,1).getDay();
  const dim=new Date(YEAR,cur,0).getDate();
  const total=Math.ceil((firstDay+dim)/7)*7;
  const today=new Date();
  const lf=lastFri(YEAR,cur);
  const dat=D[cur]||{};

  for(let i=0;i<total;i++){
    const col=i%7, dn=i-firstDay+1, inMonth=dn>=1&&dn<=dim;
    const cell=document.createElement('div');

    if(!inMonth){ cell.className='cell empty'; g.appendChild(cell); continue; }

    const h=getHolidayName(YEAR,cur,dn);
    const isOff=dn===lf;
    const isWeekend=col===0||col===6;
    const isToday=today.getFullYear()===YEAR&&today.getMonth()+1===cur&&today.getDate()===dn;

    let cls='cell';
    if(isToday) cls+=' today';
    else if(h) cls+=' hol';
    else if(isOff) cls+=' off';
    else if(isWeekend) cls+=' wknd';
    cell.className=cls;
    cell.style.setProperty('--cell-i', i);
    cell.onclick=()=>openModal(dn);

    const nd=document.createElement('div');
    nd.className='dn'+(col===0?' sun':col===6?' sat':'');
    nd.textContent=dn;
    cell.appendChild(nd);

    if(h){
      const t=document.createElement('div'); t.className='day-tag hol-tag'; t.textContent=h;
      cell.appendChild(t);
    } else if(isOff){
      const t=document.createElement('div'); t.className='day-tag off-tag'; t.textContent='공동 휴무';
      cell.appendChild(t);
    }

    const entries=(dat[dn]&&dat[dn].entries)||[];
    // sort by votes desc within cell display
    const sorted = entries.slice().sort((a,b) => (b.voters.size - a.voters.size) || (a.id - b.id));

    sorted.slice(0,2).forEach(e=>{
      const v = e.voters.size;
      const my = e.voters.has(MY_VOTER_ID);
      const c=document.createElement('div');
      c.className='chip'+(my?' voted':'');
      c.dataset.eid = e.id;
      c.innerHTML='<span class="chip-dot"></span><span class="chip-txt">'+esc(e.name)+(e.memo?' · '+esc(e.memo):'')+'</span>'+
        (v>0 ? '<span class="chip-count'+(my?' voted':'')+'">👍 '+v+'</span>' : '');
      c.onclick=ev=>{ ev.stopPropagation(); openModal(dn); };
      cell.appendChild(c);
    });

    if(sorted.length>2){
      const more=document.createElement('div');
      more.className='more-lnk';
      more.textContent='+'+(sorted.length-2)+'개 더';
      more.onclick=ev=>{ ev.stopPropagation(); openModal(dn); };
      cell.appendChild(more);
    }

    if(entries.length===0 && !isWeekend){
      const ah=document.createElement('div'); ah.className='add-hint';
      ah.innerHTML='<i class="ti ti-plus"></i>기록 추가';
      cell.appendChild(ah);
    }

    g.appendChild(cell);
  }

  const cnt=Object.values(dat).reduce((s,d)=>s+(d.entries||[]).length,0);
  document.getElementById('notice').textContent =
    cnt>0 ? MN[cur]+' · 총 '+cnt+'개 기록 · 팀원 모두와 실시간 공유 중'
          : '날짜 칸을 클릭해서 이번 달을 기록해보세요!';
}

/* ---------- modal ---------- */
function openModal(dn){
  ensureDay(cur, dn);
  es = { name: '', memo: '' };
  openDay = dn;
  renderModal(dn);
  document.body.classList.add('modal-open');
}
function closeMod(ev, ov){
  if(ev && ov && ev.target !== ov) return;
  const mw = document.getElementById('mw');
  const bd = mw.querySelector('.backdrop');
  if(!bd){ mw.innerHTML=''; openDay=null; helpOpen=false; document.body.classList.remove('modal-open'); return; }
  bd.classList.add('closing');
  setTimeout(() => {
    mw.innerHTML='';
    openDay=null; helpOpen=false;
    document.body.classList.remove('modal-open');
  }, 180);
}
function renderModal(dn){
  // If modal for the same day is already on screen, only refresh the list — no re-animation.
  const mw = document.getElementById('mw');
  const existing = mw.querySelector('.modal[data-day="' + dn + '"]');
  if(existing){
    refreshModalContent(dn, existing);
    return;
  }
  // Full mount: build shell + list, animations run once.
  mw.innerHTML = buildModalShellHTML(dn);
  refreshModalContent(dn, mw.querySelector('.modal'));
  setTimeout(()=>{ const el=document.getElementById('nName'); if(el) el.focus(); }, 30);
}

function buildModalShellHTML(dn){
  const h=getHolidayName(YEAR,cur,dn), isOff=dn===lastFri(YEAR,cur);
  const dow=DOW_KR[new Date(YEAR,cur-1,dn).getDay()];
  const sub=MN[cur]+' '+dn+'일 ('+dow+')'+(h?' · '+h:isOff?' · 공동휴무':'');

  const names = getAllRestaurantNames();
  const dataListHTML = names.length
    ? '<datalist id="restNames">'+names.map(n=>'<option value="'+esc(n)+'"></option>').join('')+'</datalist>'
    : '';

  return `
    <div class="backdrop" onclick="closeMod(event,this)">
      <div class="modal" data-day="${dn}" onclick="event.stopPropagation()" role="dialog" aria-modal="true">
        <div class="mhdr">
          <div>
            <div class="mtitle">기록 관리</div>
            <div class="msub">${esc(sub)}</div>
          </div>
          <button class="mclose" type="button" onclick="closeMod()" aria-label="닫기"><i class="ti ti-x"></i></button>
        </div>

        <div class="elist" id="modalList"></div>
        <hr class="hr" />

        <div class="igrp">
          <div>
            <div class="lbl">식당 이름</div>
            <input class="inp" type="text" id="nName" placeholder="예) 한판돼지 삼겹살"
                   maxlength="30" value="" list="restNames" autocomplete="off"
                   oninput="es.name=this.value"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();onAddClick(${dn})}" />
            ${dataListHTML}
          </div>
          <div>
            <div class="lbl">메모 (선택)</div>
            <input class="inp" type="text" id="nMemo" placeholder="예) 3층, 파스타 추천"
                   maxlength="40" value=""
                   oninput="es.memo=this.value"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();onAddClick(${dn})}" />
          </div>
        </div>

        <div class="mbtns">
          <button class="btn btn-ghost" type="button" onclick="closeMod()">닫기</button>
          <button class="btn btn-primary" type="button" onclick="onAddClick(${dn})">
            <i class="ti ti-plus"></i>추가
          </button>
        </div>

        <div class="mfooter">
          <i class="ti ti-cloud" style="font-size:13px"></i>
          실시간 동기화 · 팀원 모두와 공유됩니다
        </div>
      </div>
    </div>`;
}

function refreshModalContent(dn, modalEl){
  if(!modalEl) return;
  const entries=(D[cur][dn]&&D[cur][dn].entries)||[];
  const sorted = entries.slice().sort((a,b)=> (b.voters.size - a.voters.size) || (a.id - b.id));

  const eHTML = sorted.length ? sorted.map(e=>{
    const v=e.voters.size, my=e.voters.has(MY_VOTER_ID);
    if(_editingId === e.id){
      return `
      <div class="erow editing" data-eid="${e.id}">
        <span class="edot"></span>
        <div class="edit-form">
          <input class="inp" type="text" id="editName_${e.id}" maxlength="30"
                 value="${esc(_editDraft.name)}" list="restNames" autocomplete="off"
                 oninput="_editDraft.name=this.value"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();onSaveEditClick(${e.id})}else if(event.key==='Escape'){event.preventDefault();onCancelEditClick()}" />
          <input class="inp" type="text" id="editMemo_${e.id}" maxlength="40" placeholder="메모 (선택)"
                 value="${esc(_editDraft.memo)}"
                 oninput="_editDraft.memo=this.value"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();onSaveEditClick(${e.id})}else if(event.key==='Escape'){event.preventDefault();onCancelEditClick()}" />
        </div>
        <div class="edit-actions">
          <button class="esave" type="button" onclick="onSaveEditClick(${e.id})">저장</button>
          <button class="ecancel" type="button" onclick="onCancelEditClick()" aria-label="취소"><i class="ti ti-x"></i></button>
        </div>
      </div>`;
    }
    return `
    <div class="erow" data-eid="${e.id}">
      <span class="edot"></span>
      <div style="flex:1;min-width:0">
        <div class="ename">${esc(e.name)}</div>
        ${e.memo?'<div class="ememo">'+esc(e.memo)+'</div>':''}
      </div>
      <button class="evote${my?' voted':''}" type="button" onclick="toggleVoteAsync(${e.id})">
        <i class="ti ti-thumb-up"></i>${v}
      </button>
      <button class="eedit" type="button" onclick="onEditClick(${e.id})" aria-label="수정"><i class="ti ti-pencil"></i></button>
      <button class="edel" type="button" onclick="onDeleteClick(${e.id})" aria-label="삭제">
        <i class="ti ti-x"></i>
      </button>
    </div>`;
  }).join('') : '<div class="empty-state"><i class="ti ti-clipboard-list"></i>아직 기록된 내용이 없어요</div>';

  const list = modalEl.querySelector('#modalList');
  if(list) list.innerHTML = eHTML;
  if(_editingId != null){
    const el = document.getElementById('editName_'+_editingId);
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

function _shakeInput(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
  el.focus();
}
async function onAddClick(dn){
  const name=(es&&es.name?es.name:'').trim();
  const memo=(es&&es.memo?es.memo:'').trim();
  if(!name){ _shakeInput('nName'); return; }
  if(isDuplicateOnDay(dn, name, null)){
    _shakeInput('nName');
    showToast('이미 같은 식당이 있어요', 'err');
    return;
  }
  const ok = await addEntryAsync(dn, name, memo);
  if(ok){ es.name=''; es.memo=''; closeMod(); }
}
async function onDeleteClick(entryId){
  const ok = await showConfirm('이 기록을 삭제할까요?', '삭제');
  if(!ok) return;
  await deleteEntryAsync(entryId);
}

function onEditClick(entryId){
  const f = findEntry(entryId); if(!f) return;
  _editingId = entryId;
  _editDraft = { name: f.entry.name, memo: f.entry.memo || '' };
  renderModal(openDay);
}
function onCancelEditClick(){
  _editingId = null;
  _editDraft = { name:'', memo:'' };
  renderModal(openDay);
}
async function onSaveEditClick(entryId){
  const name = (_editDraft.name||'').trim();
  const memo = (_editDraft.memo||'').trim();
  if(!name){ _shakeInput('editName_'+entryId); return; }
  if(isDuplicateOnDay(openDay, name, entryId)){
    _shakeInput('editName_'+entryId);
    showToast('이미 같은 식당이 있어요', 'err');
    return;
  }
  const editId = entryId;
  _editingId = null; _editDraft = { name:'', memo:'' };
  await updateEntryAsync(editId, name, memo);
}

function openHelp(){
  helpOpen=true;
  document.body.classList.add('modal-open');
  document.getElementById('mw').innerHTML = `
    <div class="backdrop" onclick="closeMod(event,this)">
      <div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true">
        <div class="mhdr">
          <div>
            <div class="mtitle">사용 방법</div>
            <div class="msub">팀 GTL 캘린더 · 2026</div>
          </div>
          <button class="mclose" type="button" onclick="closeMod()" aria-label="닫기"><i class="ti ti-x"></i></button>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;font-size:13px;color:var(--text-2);line-height:1.65;margin-bottom:1.2rem">
          ${[
            ['ti-bowl','오늘 뭐 먹지?','오전엔 상단 카드에 오늘 후보가 표시됩니다. 🎲 골라줘 버튼으로 랜덤 추첨도 가능 (13시 이후 자동 숨김).'],
            ['ti-bolt','실시간 공유','다른 팀원의 추가·투표·삭제가 새로고침 없이 즉시 반영됩니다.'],
            ['ti-calendar-event','오늘로 이동','상단의 오늘 버튼이나 \`홈\` 키로 이번 달 + 오늘 칸으로 점프합니다.'],
            ['ti-moon','다크 모드','달/해 버튼으로 토글. 시스템 설정도 자동 감지합니다.'],
            ['ti-thumb-up','투표','항목 옆 👍 버튼으로 투표. 한 사람당 항목별 1표.']
          ].map(r => {
            return '<div><div style="font-weight:800;color:var(--text);margin-bottom:2px;display:flex;align-items:center;gap:7px">'+
              '<i class="ti '+r[0]+'" style="color:var(--teal);font-size:15px"></i>'+r[1]+'</div>'+
              '<div>'+r[2]+'</div></div>';
          }).join('')}
        </div>
        <div class="mbtns">
          <button class="btn btn-primary" type="button" onclick="closeMod()">확인</button>
        </div>
      </div>
    </div>`;
}

function isTypingTarget(el){
  if(!el) return false;
  const 태그=(el.tagName||'').toUpperCase();
  return 태그==='INPUT'||태그==='TEXTAREA'||el.isContentEditable;
}
function isModalOpen(){
  return !!(document.getElementById('mw').innerHTML.trim() || document.getElementById('cw').innerHTML.trim());
}
document.addEventListener('keydown',(e)=>{
  if(isTypingTarget(document.activeElement)) return;
  if(e.key==='Escape'){
    if(document.getElementById('cw').innerHTML.trim()){ resolveConfirm(null,null,false); return; }
    if(document.getElementById('mw').innerHTML.trim()){ closeMod(); return; }
  }
  if(isModalOpen()) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); changeMonth(-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); changeMonth(1); }
  else if(e.key==='Home' || e.key==='t' || e.key==='T'){ e.preventDefault(); jumpToToday(); }
  else if(e.key==='d' || e.key==='D'){ e.preventDefault(); toggleTheme(); }
});

// Re-check hero visibility every minute (covers 13:00 boundary without reload)
setInterval(() => { if(isTodaysMonth()) renderHero(); }, 60*1000);

/* ---------- boot ---------- */
(async () => {
  // theme: render theme icon based on the already-applied attribute
  applyTheme(document.documentElement.getAttribute('data-theme') || 'light');

  MY_VOTER_ID = getOrMakeVoterId();
  renderTabs();
  renderHero();
  render(true);
  updateNavButtons();

  sb = initSupabase();
  if(!sb) return;
  await loadAll();
  subscribe();
})();
</script>

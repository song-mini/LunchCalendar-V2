/* ---------- mutations ---------- */
function normalizeName(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function getAllRestaurantNames(){
  const set = new Set();
  YEARS.forEach(y => MONTHS.forEach(m => Object.values((D[y]||{})[m]||{}).forEach(d =>
    (d.entries||[]).forEach(e => { if(e.name) set.add(e.name); })
  )));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'ko'));
}
function isDuplicateOnDay(day, name, ignoreId){
  const list = (((D[curYear]||{})[cur]||{})[day] || {}).entries || [];
  const norm = normalizeName(name);
  return list.some(e => e.id !== ignoreId && normalizeName(e.name) === norm);
}

async function addEntryAsync(day, name, memo){
  setSyncState('sv');
  const { error } = await sb.from('entries').insert({
    year:curYear, month:cur, day, name, memo:memo||'', created_by:MY_VOTER_ID
  });
  setSyncState(error?'err':'ok');
  if(error){ showToast('저장 실패: '+error.message, 'err'); return false; }
  return true;
}
async function updateEntryAsync(entryId, name, memo){
  const f = findEntry(entryId);
  let backup=null;
  if(f){ backup = { name:f.entry.name, memo:f.entry.memo }; f.entry.name=name; f.entry.memo=memo||''; rerender(); }
  setSyncState('sv');
  const { error } = await sb.from('entries').update({ name, memo: memo||'' }).eq('id', entryId);
  if(error){
    if(f && backup){ f.entry.name=backup.name; f.entry.memo=backup.memo; rerender(); }
    setSyncState('err'); showToast('수정 실패: '+error.message, 'err'); return false;
  }
  setSyncState('ok');
  return true;
}
async function deleteEntryAsync(entryId){
  // animate out first so the row collapses instead of vanishing
  const els = document.querySelectorAll(
    '[data-eid="'+entryId+'"], [data-entry-id="'+entryId+'"]'
  );
  els.forEach(el => el.classList.add('removing'));
  if(els.length){ await new Promise(r => setTimeout(r, 240)); }

  const f = findEntry(entryId);
  let restore=null;
  if(f){
    restore = { y:f.y, m:f.m, d:f.d, idx:f.idx, entry:f.entry };
    D[f.y][f.m][f.d].entries.splice(f.idx, 1);
    rerender();
  }
  setSyncState('sv');
  const { error } = await sb.from('entries').delete().eq('id', entryId);
  if(error){
    if(restore) D[restore.y][restore.m][restore.d].entries.splice(restore.idx, 0, restore.entry);
    rerender(); setSyncState('err'); showToast('삭제 실패: '+error.message, 'err'); return;
  }
  setSyncState('ok');
}
const _votingIds = new Set();
function _animateVote(entryId, becameVoted){
  if(becameVoted && navigator.vibrate){ try { navigator.vibrate(10); } catch(e){} }
  requestAnimationFrame(() => {
    document.querySelectorAll(
      '[data-eid="'+entryId+'"] .evote, [data-entry-id="'+entryId+'"] .hero-vote'
    ).forEach(btn => {
      btn.classList.remove('popping','bumping');
      void btn.offsetWidth;
      btn.classList.add('popping','bumping');
      btn.addEventListener('animationend', () => btn.classList.remove('popping','bumping'), { once: true });
    });
    document.querySelectorAll(
      '[data-eid="'+entryId+'"] .vote-num, [data-entry-id="'+entryId+'"] .vote-num'
    ).forEach(el => {
      el.classList.remove('rolling');
      void el.offsetWidth;
      el.classList.add('rolling');
      el.addEventListener('animationend', () => el.classList.remove('rolling'), { once: true });
    });
  });
}
async function toggleVoteAsync(entryId){
  if(_votingIds.has(entryId)) return;
  _votingIds.add(entryId);
  try{
    const f = findEntry(entryId); if(!f) return;
    const was = f.entry.voters.has(MY_VOTER_ID);
    if(was) f.entry.voters.delete(MY_VOTER_ID); else f.entry.voters.add(MY_VOTER_ID);
    rerender();
    _animateVote(entryId, !was);
    setSyncState('sv');
    const { error } = was
      ? await sb.from('votes').delete().eq('entry_id', entryId).eq('voter_id', MY_VOTER_ID)
      : await sb.from('votes').insert({ entry_id: entryId, voter_id: MY_VOTER_ID });
    if(error){
      if(was) f.entry.voters.add(MY_VOTER_ID); else f.entry.voters.delete(MY_VOTER_ID);
      rerender(); setSyncState('err'); showToast('투표 처리 실패', 'err'); return;
    }
    setSyncState('ok');
  } finally {
    _votingIds.delete(entryId);
  }
}

function todayInfo(){
  const now = new Date();
  return {
    y: now.getFullYear(),
    m: now.getMonth()+1,
    d: now.getDate(),
    hour: now.getHours(),
    dow: DOW_KR[now.getDay()]
  };
}
function isTodaysMonth(){
  const t = todayInfo();
  return t.y===curYear && t.m===cur;
}
function shouldShowHero(){
  const t = todayInfo();
  // Only show on today's month + before HERO_HIDE_HOUR
  if(!isTodaysMonth()) return false;
  if(t.hour >= HERO_HIDE_HOUR) return false;
  return true;
}
function getTodayEntries(){
  const t = todayInfo();
  if(!YEARS.includes(t.y) || !MONTHS.includes(t.m)) return [];
  const day = ((D[t.y]||{})[t.m]||{})[t.d];
  if(!day) return [];
  // sort by votes desc, then by id asc
  return day.entries.slice().sort((a,b) => (b.voters.size - a.voters.size) || (a.id - b.id));
}

function rollDice(){
  const entries = getTodayEntries();
  if(entries.length < 2) return;
  const btn = document.getElementById('diceBtn') || document.getElementById('diceBtnSide');
  if(btn){ btn.classList.add('rolling'); btn.disabled = true; }

  // Stacked layout uses #heroList with .hero-row. Sidebar layout uses
  // .today-leader (rank 1) + .today-list .today-row (rank 2+). Pick whichever
  // exists in the current DOM so the animation works in both layouts.
  let rows = [];
  const heroList = document.getElementById('heroList');
  if(heroList){
    rows = Array.from(heroList.querySelectorAll('.hero-row'));
  } else {
    const sidebar = document.getElementById('todaySidebar');
    if(sidebar){
      const leader = sidebar.querySelector('.today-leader');
      if(leader) rows.push(leader);
      rows.push(...sidebar.querySelectorAll('.today-row'));
    }
  }
  if(!rows.length){ if(btn){ btn.classList.remove('rolling'); btn.disabled = false; } return; }

  // 무작위로 한 명 뽑기 — 투표 수와 무관하게 균등 확률 (rows.length로 고정해서
  // 사이드바가 4개만 노출해도 표시된 후보 안에서만 뽑히도록).
  const pickIdx = Math.floor(Math.random() * rows.length);

  // Phase 1: dice rolls solo (~900ms). Phase 2: shuffle-spotlight, then settle on pick.
  setTimeout(() => {
    if(btn){ btn.classList.remove('rolling'); btn.disabled = false; }
    let i = 0;
    const shuffleCount = 8;
    const id = setInterval(() => {
      rows.forEach(r => r.classList.remove('spotlight'));
      rows[i % rows.length].classList.add('spotlight');
      i++;
      if(i >= shuffleCount){
        clearInterval(id);
        rows.forEach(r => r.classList.remove('spotlight','dice-winner'));
        const winner = rows[pickIdx];
        winner.classList.add('dice-winner');
        winner.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        if(navigator.vibrate){ try { navigator.vibrate([12, 60, 18]); } catch(e){} }
        winner.addEventListener('animationend', () => winner.classList.remove('dice-winner'), { once: true });
      }
    }, 80);
  }, 900);
}

                 oninput="dscTitle=this.value" />

function renderDscCal(){
  const g = document.getElementById('dscGrid');
  const lbl = document.getElementById('dscMonth');
  if(!g || !lbl || !dscView) return;
  const y = dscView.y, m = dscView.m;
  lbl.textContent = y + '년 ' + MN[m];

  const t = new Date();
  const t0 = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
  const firstDay = new Date(y, m-1, 1).getDay();
  const dim = new Date(y, m, 0).getDate();

  let out = DOW_KR.map((d,i)=>'<span class="ds-dow'+(i===0?' sun':i===6?' sat':'')+'">'+d+'</span>').join('');
  for(let i=0;i<firstDay;i++) out += '<span class="ds-day empty"></span>';
  for(let d=1; d<=dim; d++){
    const time = new Date(y, m-1, d).getTime();
    const taken = !!getDinnerOn(y, m, d);
    const dis = time < t0 || taken;
    const sel = dscSel && dscSel.y===y && dscSel.m===m && dscSel.d===d;
    const col = new Date(y, m-1, d).getDay();
    out += '<button type="button" class="ds-day'+(sel?' sel':'')+(time===t0?' today-mark':'')+
      (col===0?' sun':col===6?' sat':'')+'"'+
      (dis?' disabled':'')+(taken?' title="이미 회식이 있는 날이에요"':'')+
      ' onclick="dscPick('+d+')">'+(taken?'🍻':d)+'</button>';
  }
  g.innerHTML = out;

  // 이동 범위: 이번 달 ~ 마지막 지원 연도 12월
  const idx = YEARS.indexOf(y)*12 + (m-1);
  const minIdx = YEARS.includes(t.getFullYear()) ? YEARS.indexOf(t.getFullYear())*12 + t.getMonth() : 0;
  const maxIdx = YEARS.length*12 - 1;
  const prevB = document.getElementById('dscPrev'), nextB = document.getElementById('dscNext');
  if(prevB) prevB.disabled = idx <= minIdx;
  if(nextB) nextB.disabled = idx >= maxIdx;

  const btn = document.getElementById('dscConfirmBtn');
  if(btn){
    if(dscSel){
      const dow = DOW_KR[new Date(dscSel.y, dscSel.m-1, dscSel.d).getDay()];
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-calendar-plus"></i>' +
        dscSel.m + '월 ' + dscSel.d + '일 (' + dow + ') 로 잡기';
    } else {
      btn.disabled = true;
      btn.textContent = '날짜를 골라주세요';
    }
  }
}

function dscNav(delta){
  if(!dscView) return;
  const t = new Date();
  const idx = YEARS.indexOf(dscView.y)*12 + (dscView.m-1) + delta;
  const minIdx = YEARS.includes(t.getFullYear()) ? YEARS.indexOf(t.getFullYear())*12 + t.getMonth() : 0;
  const maxIdx = YEARS.length*12 - 1;
  if(idx < minIdx || idx > maxIdx) return;
  dscView = { y: YEARS[Math.floor(idx/12)], m: (idx%12)+1 };
  renderDscCal();
}

function dscPick(d){
  if(!dscView) return;
  dscSel = { y: dscView.y, m: dscView.m, d };
  renderDscCal();
}

async function dscConfirm(){
  if(!dscSel) return;
  const y = dscSel.y, m = dscSel.m, dd = dscSel.d;
  if(getDinnerOn(y, m, dd)){ showToast('그 날엔 이미 회식이 있어요', 'err'); renderDscCal(); return; }
  const title = (dscTitle||'').trim();
  const btn = document.getElementById('dscConfirmBtn');
  if(btn) btn.disabled = true;
  setSyncState('sv');
  const { error } = await sb.from('dinners').insert({
    year:y, month:m, day:dd, title, created_by:MY_VOTER_ID
  });
  setSyncState(error ? 'err' : 'ok');
  if(error){
    if(btn) btn.disabled = false;
    showToast('회식 저장 실패: ' + error.message, 'err');
    return;
  }
  closeMod();
  showToast('🍻 회식이 잡혔어요! 배너에서 장소를 정해보세요', 'ok');
}

async function onDeleteDinnerClick(id){
  const ok = await showConfirm('이 회식을 취소할까요? 장소 후보와 투표도 함께 삭제돼요.', '회식 취소');
  if(!ok) return;
  const i = DINNERS.findIndex(d => d.id === id);
  let backup = null;
  if(i >= 0){ backup = DINNERS[i]; DINNERS.splice(i, 1); }
  if(openDinnerId === id) closeMod();
  rerender();
  if(window._refreshTweaks) window._refreshTweaks();
  setSyncState('sv');
  const { error } = await sb.from('dinners').delete().eq('id', id);
  if(error){
    if(backup){ DINNERS.push(backup); sortDinners(); }
    rerender();
    if(window._refreshTweaks) window._refreshTweaks();
    setSyncState('err'); showToast('취소 실패: ' + error.message, 'err');
    return;
  }
  setSyncState('ok');
  showToast('회식을 취소했어요', 'ok');
}

async function onAddDinnerPlaceClick(dinnerId){
  const name = (ds.name||'').trim();
  const memo = (ds.memo||'').trim();
  if(!name){ _shakeInput('dpName'); return; }
  const d = findDinner(dinnerId); if(!d) return;
  const norm = normalizeName(name);
  if(d.places.some(p => normalizeName(p.name) === norm)){
    _shakeInput('dpName');
    showToast('이미 같은 장소가 있어요', 'err');
    return;
  }
  setSyncState('sv');
  const { error } = await sb.from('dinner_places').insert({
    dinner_id: dinnerId, name, memo, created_by: MY_VOTER_ID
  });
  setSyncState(error ? 'err' : 'ok');
  if(error){ showToast('저장 실패: ' + error.message, 'err'); return; }
  // 후보는 보통 연달아 올리니 모달을 열어둔 채 입력만 비운다
  ds = { name:'', memo:'' };
  const n = document.getElementById('dpName'), m = document.getElementById('dpMemo');
  if(n) n.value = '';
  if(m) m.value = '';
  if(n) n.focus();
}

async function onDeleteDinnerPlaceClick(placeId){
  const ok = await showConfirm('이 장소 후보를 삭제할까요?', '삭제');
  if(!ok) return;
  const els = document.querySelectorAll('[data-eid="d'+placeId+'"]');
  els.forEach(el => el.classList.add('removing'));
  if(els.length){ await new Promise(r => setTimeout(r, 240)); }
  const f = findDinnerPlace(placeId);
  let restore = null;
  if(f){
    restore = { dinner: f.dinner, idx: f.idx, place: f.place };
    f.dinner.places.splice(f.idx, 1);
    rerender();
  }
  setSyncState('sv');
  const { error } = await sb.from('dinner_places').delete().eq('id', placeId);
  if(error){
    if(restore) restore.dinner.places.splice(restore.idx, 0, restore.place);
    rerender(); setSyncState('err'); showToast('삭제 실패: ' + error.message, 'err');
    return;
  }
  setSyncState('ok');
}

const _dinnerVotingIds = new Set();
async function toggleDinnerVoteAsync(placeId){
  if(_dinnerVotingIds.has(placeId)) return;
  _dinnerVotingIds.add(placeId);
  try{
    const f = findDinnerPlace(placeId); if(!f) return;
    const was = f.place.voters.has(MY_VOTER_ID);
    if(was) f.place.voters.delete(MY_VOTER_ID); else f.place.voters.add(MY_VOTER_ID);
    rerender();
    _animateVote('d'+placeId, !was);
    setSyncState('sv');
    const { error } = was
      ? await sb.from('dinner_votes').delete().eq('place_id', placeId).eq('voter_id', MY_VOTER_ID)
      : await sb.from('dinner_votes').insert({ place_id: placeId, voter_id: MY_VOTER_ID });
    if(error){
      if(was) f.place.voters.add(MY_VOTER_ID); else f.place.voters.delete(MY_VOTER_ID);
      rerender(); setSyncState('err'); showToast('투표 처리 실패', 'err');
      return;
    }
    setSyncState('ok');
  } finally {
    _dinnerVotingIds.delete(placeId);
  }
}

// rerender 에서 호출 — 열려 있는 회식 모달의 목록만 갱신 (재애니메이션 없음)
function refreshDinnerModal(){
  const mw = document.getElementById('mw');
  const modal = mw && mw.querySelector('.modal[data-dinner-id]');
  if(!modal) return;
  const id = +modal.getAttribute('data-dinner-id');
  const d = findDinner(id);
  if(!d){ closeMod(); return; }
  refreshDinnerModalContent(d, modal);
}

function refreshDinnerModalContent(d, modalEl){
  modalEl = modalEl || document.querySelector('.modal[data-dinner-id="'+d.id+'"]');
  if(!modalEl) return;
  const sorted = d.places.slice().sort((a,b)=> (b.voters.size - a.voters.size) || (a.id - b.id));
  const maxV = sorted.length ? sorted[0].voters.size : 0;

  const html = sorted.length ? sorted.map(p => {
    const v = p.voters.size, my = p.voters.has(MY_VOTER_ID);
    const win = v > 0 && v === maxV;
    return `
    <div class="erow${win?' winner':''}" data-eid="d${p.id}">
      ${win ? '<span class="chip-crown">👑</span>' : '<span class="edot"></span>'}
      <div style="flex:1;min-width:0">
        <div class="ename">${esc(p.name)}</div>
        ${p.memo ? '<div class="ememo">'+esc(p.memo)+'</div>' : ''}
      </div>
      <button class="evote${my?' voted':''}" type="button" aria-pressed="${my}" aria-label="투표"
              onclick="toggleDinnerVoteAsync(${p.id})">
        <i class="ti ti-thumb-up"></i><span class="vote-num">${v}</span>
      </button>
      <button class="edel" type="button" onclick="onDeleteDinnerPlaceClick(${p.id})" aria-label="삭제">
        <i class="ti ti-x"></i>
      </button>
    </div>`;
  }).join('') : '<div class="empty-state"><i class="ti ti-map-pin"></i>아직 장소 후보가 없어요<br/>첫 후보를 올려보세요!</div>';

  const list = modalEl.querySelector('#dinnerList');
  if(list) list.innerHTML = html;
  const dice = modalEl.querySelector('#dinnerDiceBtn');
  if(dice) dice.style.display = sorted.length >= 2 ? '' : 'none';
}

// 장소 랜덤 추첨 — 점심 rollDice 와 같은 셔플-스포트라이트 연출
function rollDinnerDice(){
  const list = document.getElementById('dinnerList');
  if(!list) return;
  const rows = Array.from(list.querySelectorAll('.erow'));
  if(rows.length < 2) return;
  const btn = document.getElementById('dinnerDiceBtn');
  if(btn) btn.disabled = true;
  const pickIdx = Math.floor(Math.random() * rows.length);
  let i = 0;
  const shuffleCount = 8;
  const id = setInterval(() => {
    rows.forEach(r => r.classList.remove('spotlight'));
    rows[i % rows.length].classList.add('spotlight');
    i++;
    if(i >= shuffleCount){
      clearInterval(id);
      rows.forEach(r => r.classList.remove('spotlight','dice-winner'));
      const winner = rows[pickIdx];
      winner.classList.add('dice-winner');
      winner.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      if(navigator.vibrate){ try { navigator.vibrate([12, 60, 18]); } catch(e){} }
      winner.addEventListener('animationend', () => winner.classList.remove('dice-winner'), { once: true });
      if(window._fireConfetti) window._fireConfetti(winner);
      if(btn) btn.disabled = false;
    }
  }, 90);
}

/* ---------- jump to today ---------- */

  const t = todayInfo();

      cells[0].animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }],
        { duration: 550, easing: 'cubic-bezier(.34,1.56,.64,1)' }
      );
    }
  }, 250);
}

/* ---------- render ---------- */
function rerender(animate){
  renderTabs();
  renderHero();
  renderSidebarHero();
  renderDinnerBanner();
  render(animate);
  if(openDay!=null) renderModal(openDay);
  if(openDinnerId!=null) refreshDinnerModal();
  updateNavButtons();
}
function _curIdx(){ return YEARS.indexOf(curYear) * 12 + (cur - 1); }
function _totalMonths(){ return YEARS.length * 12; }

function updateNavButtons(){
  const i = _curIdx(), total = _totalMonths();
  const navs = document.querySelectorAll('.month-ctrl .nav-btn');
  if(navs[0]) navs[0].disabled = (i <= 0);
  if(navs[1]) navs[1].disabled = (i >= total - 1);
  const yns = document.querySelectorAll('.year-sel .nav-btn');
  const yi = YEARS.indexOf(curYear);
  if(yns[0]) yns[0].disabled = (yi <= 0);
  if(yns[1]) yns[1].disabled = (yi >= YEARS.length - 1);
}

function renderTabs(){
  const c=document.getElementById('monthTabs');
  c.innerHTML='';

  // Year selector — prev / label / next
  const ys = document.createElement('div');
  ys.className = 'year-sel';
  ys.innerHTML =
    '<button class="nav-btn" type="button" onclick="changeYear(-1)" aria-label="이전 해">' +
      '<i class="ti ti-chevron-left"></i></button>' +
    '<span class="year-label">' + curYear + '</span>' +
    '<button class="nav-btn" type="button" onclick="changeYear(1)" aria-label="다음 해">' +
      '<i class="ti ti-chevron-right"></i></button>';
  c.appendChild(ys);

  // Month tabs (1-12 for the current year)
  MONTHS.forEach(m => {
    const t=document.createElement('button');
    t.type='button';
    t.className='tab'+(m===cur?' active':'')+(hasDat(curYear, m)&&m!==cur?' has-data':'');
    t.setAttribute('role','tab');
    t.textContent=MN[m];
    t.onclick=()=>sw(curYear, m);
    c.appendChild(t);
  });
}

function sw(y, m){
  // Backwards-compatible: sw(month) means same year.
  if(m === undefined){ m = y; y = curYear; }
  if(!YEARS.includes(y) || !MONTHS.includes(m)) return;
  if(y === curYear && m === cur) return;
  const prevIdx = _curIdx();
  curYear = y; cur = m;
  const newIdx = _curIdx();
  renderTabs();
  renderHero();
  renderSidebarHero();
  render(false); // skip mount stagger; slide handles entrance
  const g = document.getElementById('calGrid');
  g.classList.remove('slide-r', 'slide-l');
  void g.offsetWidth;
  g.classList.add(newIdx > prevIdx ? 'slide-r' : 'slide-l');
  updateNavButtons();
  // 월 라벨 micro-pop — 달이 실제로 바뀔 때만
  const ml = document.querySelector('.month-label');
  if(ml && typeof ml.animate === 'function'){
    ml.animate(
      [{ opacity: .35, transform: 'translateY(-3px)' }, { opacity: 1, transform: 'translateY(0)' }],
      { duration: 220, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.1)' }
    );
  }
}

function changeMonth(delta){
  // Step across year boundaries
  const n = _curIdx() + delta;
  if(n < 0 || n >= _totalMonths()) return;
  const newY = YEARS[Math.floor(n / 12)];
  const newM = (n % 12) + 1;
  sw(newY, newM);
}
function changeYear(delta){
  const i = YEARS.indexOf(curYear);
  const n = i + delta;
  if(n < 0 || n >= YEARS.length) return;
  sw(YEARS[n], cur);
}

function render(animate){
  document.getElementById('monthTitle').textContent = curYear + '년 ' + MN[cur];

  const g=document.getElementById('calGrid');
  g.classList.remove('mounting');
  g.innerHTML='';
  if(animate){
    g.classList.add('mounting');
    setTimeout(()=> g.classList.remove('mounting'), 700);
  }

  DOW_KR.forEach((d,i)=>{
    const el=document.createElement('div');
    el.className='dow'+(i===0?' sun':i===6?' sat':'');
    el.textContent=d;
    g.appendChild(el);
  });

  if(!_loaded){
    // skeleton grid while initial data loads
    for(let i=0;i<35;i++){
      const sk = document.createElement('div');
      sk.className = 'cell skeleton';
      g.appendChild(sk);
    }
    document.getElementById('notice').textContent = '';
    return;
  }

  const firstDay=new Date(curYear,cur-1,1).getDay();
  const dim=new Date(curYear,cur,0).getDate();
  const total=Math.ceil((firstDay+dim)/7)*7;
  const today=new Date();
  const lf=lastFri(curYear,cur);
  const dat=((D[curYear]||{})[cur])||{};

  for(let i=0;i<total;i++){
    const col=i%7, dn=i-firstDay+1, inMonth=dn>=1&&dn<=dim;
    const cell=document.createElement('div');

    if(!inMonth){ cell.className='cell empty'; g.appendChild(cell); continue; }

    const h=getHolidayName(curYear,cur,dn);
    const isOff=dn===lf;
    const isWeekend=col===0||col===6;
    const isToday=today.getFullYear()===curYear&&today.getMonth()+1===cur&&today.getDate()===dn;

    let cls='cell';
    if(isToday) cls+=' today';
    else if(h) cls+=' hol';
    else if(isOff) cls+=' off';
    else if(isWeekend) cls+=' wknd';
    cell.className=cls;
    cell.style.setProperty('--cell-i', i);
    cell.onclick=()=>openModal(dn);

    const nd=document.createElement('div');
    nd.className='dn'+(col===0?' sun':col===6?' sat':'');
    nd.textContent=dn;
    cell.appendChild(nd);

    if(h){
      const t=document.createElement('div'); t.className='day-tag hol-tag'; t.textContent=h;
      cell.appendChild(t);
    } else if(isOff){
      const t=document.createElement('div'); t.className='day-tag off-tag'; t.textContent='공동 휴무';
      cell.appendChild(t);
    }

    const dnr = getDinnerOn(curYear, cur, dn);
    if(dnr){
      cell.classList.add('dinner');
      const t=document.createElement('div');
      t.className='day-tag dinner-tag';
      t.title='회식 · 장소 정하기';
      t.textContent='🍻 ' + (dnr.title || '회식');
      t.onclick=ev=>{ ev.stopPropagation(); openDinnerModal(dnr.id); };
      cell.appendChild(t);
    }

    const entries=(dat[dn]&&dat[dn].entries)||[];
    // sort by votes desc within cell display
    const sorted = entries.slice().sort((a,b) => (b.voters.size - a.voters.size) || (a.id - b.id));

    sorted.slice(0,2).forEach((e,ci)=>{
      const v = e.voters.size;
      const my = e.voters.has(MY_VOTER_ID);
      const isTop = ci === 0 && v > 0;
      const c=document.createElement('div');
      c.className='chip'+(my?' voted':'');
      c.dataset.eid = e.id;
      c.innerHTML=(isTop ? '<span class="chip-crown">👑</span>' : '<span class="chip-dot"></span>')+
        '<span class="chip-txt">'+esc(e.name)+(e.memo?' · '+esc(e.memo):'')+'</span>'+
        (v>0 ? '<span class="chip-count'+(my?' voted':'')+'">👍 <span class="vote-num">'+v+'</span></span>' : '');
      c.onclick=ev=>{ ev.stopPropagation(); openModal(dn); };
      cell.appendChild(c);
    });

    if(sorted.length>2){
      const more=document.createElement('div');
      more.className='more-lnk';
      more.textContent='+'+(sorted.length-2)+'개 더';
      more.onclick=ev=>{ ev.stopPropagation(); openModal(dn); };
      cell.appendChild(more);
    }

    if(entries.length===0 && !isWeekend){
      const ah=document.createElement('div'); ah.className='add-hint';
      ah.innerHTML='<i class="ti ti-plus"></i>기록 추가';
      cell.appendChild(ah);
    }

    g.appendChild(cell);
  }

  const cnt=Object.values(dat).reduce((s,d)=>s+(d.entries||[]).length,0);
  document.getElementById('notice').textContent =
    cnt>0 ? curYear+'년 '+MN[cur]+' · 총 '+cnt+'개 기록 · 팀원 모두와 실시간 공유 중'
          : '날짜 칸을 클릭해서 이번 달을 기록해보세요!';
}

function openModal(dn){
  ensureDay(curYear, cur, dn);
  es = { name: '', memo: '' };
  openDay = dn;
  openDinnerId = null;  // mw 를 점유하므로 회식 모달 상태는 해제
  renderModal(dn);
  document.body.classList.add('modal-open');
}
function closeMod(ev, ov){
  if(ev && ov && ev.target !== ov) return;
  const mw = document.getElementById('mw');
  const bd = mw.querySelector('.backdrop');
  if(!bd){ mw.innerHTML=''; openDay=null; helpOpen=false; openDinnerId=null; document.body.classList.remove('modal-open'); return; }
  bd.classList.add('closing');
  setTimeout(() => {
    // 닫는 사이 다른 모달이 mw 를 차지했다면 (빠른 연속 클릭) 건드리지 않는다
    if(!mw.contains(bd)) return;
    mw.innerHTML='';
    openDay=null; helpOpen=false; openDinnerId=null;
    document.body.classList.remove('modal-open');
  }, 220);
}
function renderModal(dn){
  // If modal for the same day is already on screen, only refresh the list — no re-animation.
  const mw = document.getElementById('mw');
  const existing = mw.querySelector('.modal[data-day="' + dn + '"]');
  if(existing){
    refreshModalContent(dn, existing);
    return;
  }
  // Full mount: build shell + list, animations run once.
  mw.innerHTML = buildModalShellHTML(dn);
  refreshModalContent(dn, mw.querySelector('.modal'));
  setTimeout(()=>{ const el=document.getElementById('nName'); if(el) el.focus(); }, 30);
}

function refreshModalContent(dn, modalEl){
  if(!modalEl) return;
  const entries=(((D[curYear]||{})[cur]||{})[dn]&&D[curYear][cur][dn].entries)||[];
  const sorted = entries.slice().sort((a,b)=> (b.voters.size - a.voters.size) || (a.id - b.id));

  const totalV = sorted.reduce((s,e)=>s+e.voters.size, 0);
  const eHTML = sorted.length ? sorted.map((e,i)=>{
    const v=e.voters.size, my=e.voters.has(MY_VOTER_ID);
    const win = i===0 && v>0;
    if(_editingId === e.id){
      return `
      <div class="erow editing" data-eid="${e.id}">
        <div class="edit-form">
          <input class="inp" type="text" id="editName_${e.id}" maxlength="30"
                 value="${esc(_editDraft.name)}" list="restNames" autocomplete="off"
                 oninput="_editDraft.name=this.value"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();onSaveEditClick(${e.id})}else if(event.key==='Escape'){event.preventDefault();onCancelEditClick()}" />
          <input class="inp" type="text" id="editMemo_${e.id}" maxlength="40" placeholder="메모 (선택)"
                 value="${esc(_editDraft.memo)}"
                 oninput="_editDraft.memo=this.value"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();onSaveEditClick(${e.id})}else if(event.key==='Escape'){event.preventDefault();onCancelEditClick()}" />
        </div>
        <div class="edit-actions">
          <button class="esave" type="button" onclick="onSaveEditClick(${e.id})">저장</button>
          <button class="ecancel" type="button" onclick="onCancelEditClick()" aria-label="취소"><i class="ti ti-x"></i></button>
        </div>
      </div>`;
    }
    return `
    <div class="erow${win?' winner':''}" data-eid="${e.id}">
      <div class="erank">${win?'👑':(i+1)}</div>
      <div class="einfo">
        <div class="ename">${esc(e.name)}</div>
        ${e.memo?'<div class="ememo">'+esc(e.memo)+'</div>':''}
      </div>
      <div class="eacts">
        <button class="eedit" type="button" onclick="onEditClick(${e.id})" aria-label="수정"><i class="ti ti-pencil"></i></button>
        <button class="edel" type="button" onclick="onDeleteClick(${e.id})" aria-label="삭제">
          <i class="ti ti-x"></i>
        </button>
      </div>
      <button class="evote${my?' voted':''}" type="button" aria-pressed="${my}" aria-label="투표" onclick="toggleVoteAsync(${e.id})">
        <i class="ti ti-thumb-up"></i><span class="vote-num">${v}</span>
      </button>
    </div>`;
  }).join('') : '<div class="empty-state"><i class="ti ti-clipboard-list"></i>아직 후보가 없어요<br/>아래에서 첫 후보를 올려보세요!</div>';

  const list = modalEl.querySelector('#modalList');
  if(list) list.innerHTML = eHTML;
  const cntEl = modalEl.querySelector('#mCount');
  if(cntEl) cntEl.textContent = sorted.length;
  const vWrap = modalEl.querySelector('#mVotesWrap');
  const vEl = modalEl.querySelector('#mVotes');
  if(vWrap) vWrap.hidden = totalV === 0;
  if(vEl) vEl.textContent = totalV;
  if(_editingId != null){
    const el = document.getElementById('editName_'+_editingId);
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

function _shakeInput(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
  el.focus();
}
async function onAddClick(dn){
  const name=(es&&es.name?es.name:'').trim();
  const memo=(es&&es.memo?es.memo:'').trim();
  if(!name){ _shakeInput('nName'); return; }
  if(isDuplicateOnDay(dn, name, null)){
    _shakeInput('nName');
    showToast('이미 같은 식당이 있어요', 'err');
    return;
  }
  const ok = await addEntryAsync(dn, name, memo);
  if(ok){ es.name=''; es.memo=''; closeMod(); }
}
async function onDeleteClick(entryId){
  const ok = await showConfirm('이 기록을 삭제할까요?', '삭제');
  if(!ok) return;
  await deleteEntryAsync(entryId);
}

function onEditClick(entryId){
  const f = findEntry(entryId); if(!f) return;
  _editingId = entryId;
  _editDraft = { name: f.entry.name, memo: f.entry.memo || '' };
  renderModal(openDay);
}
function onCancelEditClick(){
  _editingId = null;
  _editDraft = { name:'', memo:'' };
  renderModal(openDay);
}
async function onSaveEditClick(entryId){
  const name = (_editDraft.name||'').trim();
  const memo = (_editDraft.memo||'').trim();
  if(!name){ _shakeInput('editName_'+entryId); return; }
  if(isDuplicateOnDay(openDay, name, entryId)){
    _shakeInput('editName_'+entryId);
    showToast('이미 같은 식당이 있어요', 'err');
    return;
  }
  const editId = entryId;
  _editingId = null; _editDraft = { name:'', memo:'' };
  await updateEntryAsync(editId, name, memo);
}

function isTypingTarget(el){
  if(!el) return false;
  const 태그=(el.tagName||'').toUpperCase();
  return 태그==='INPUT'||태그==='TEXTAREA'||el.isContentEditable;
}
function isModalOpen(){
  return !!(document.getElementById('mw').innerHTML.trim() || document.getElementById('cw').innerHTML.trim());
}
document.addEventListener('keydown',(e)=>{
  // Escape closes dialogs even while an input is focused (platform convention).
  // Skips IME composition and inputs that already handled Escape themselves
  // (edit rows cancel editing via their own onkeydown + preventDefault).
  if(e.key==='Escape' && !e.isComposing && !e.defaultPrevented){
    if(document.getElementById('cw').innerHTML.trim()){ resolveConfirm(null,null,false); return; }
    if(document.getElementById('mw').innerHTML.trim()){ closeMod(); return; }
  }
  if(isTypingTarget(document.activeElement)) return;
  if(isModalOpen()) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); changeMonth(-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); changeMonth(1); }
  else if(e.key==='Home' || e.key==='t' || e.key==='T'){ e.preventDefault(); jumpToToday(); }
  else if(e.key==='d' || e.key==='D'){ e.preventDefault(); toggleTheme(); }
});

// Mouse wheel over the calendar/tabs: down = next month, up = previous.
// 델타 누적 + 쿨다운으로 트랙패드 관성 스크롤에도 한 칸씩만 움직인다.
let _wheelAcc = 0, _wheelLock = 0;
document.addEventListener('wheel', (e) => {
  if(isModalOpen()) return;
  if(!(e.target.closest && e.target.closest('#calGrid, #monthTabs'))) return;
  e.preventDefault();
  const now = Date.now();
  if(now < _wheelLock){ _wheelAcc = 0; return; }
  _wheelAcc += e.deltaY;
  if(Math.abs(_wheelAcc) >= 60){
    changeMonth(_wheelAcc > 0 ? 1 : -1);
    _wheelAcc = 0;
    _wheelLock = now + 400;
  }
}, { passive: false });

// Touch swipe: left/right to change month
let _touchStartX = null, _touchStartY = null;
document.addEventListener('touchstart', ev => {
  if(ev.touches.length !== 1 || isModalOpen()){ _touchStartX = null; return; }
  _touchStartX = ev.touches[0].clientX;
  _touchStartY = ev.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', ev => {
  if(_touchStartX === null || ev.changedTouches.length !== 1) return;
  const dx = ev.changedTouches[0].clientX - _touchStartX;
  const dy = ev.changedTouches[0].clientY - _touchStartY;
  _touchStartX = null; _touchStartY = null;
  if(Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
  changeMonth(dx < 0 ? 1 : -1);
}, { passive: true });

// Re-check hero visibility every minute (covers 13:00 boundary without reload)
setInterval(() => { if(isTodaysMonth()){ renderHero(); renderSidebarHero(); } }, 60*1000);

/* =================================================================
   v2 polish — runs inside the main script so it can reach D, curYear,
   MY_VOTER_ID, rollDice, openModal, renderHero. All side-effects are
   additive — nothing in the original render path was changed.
   ================================================================= */
(function v2Polish(){
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Geist 리디자인에서 제거된 효과: 커서 보더 글로우, 3D 틸트,
     클릭 리플, 히어로 블롭 패럴랙스, 마그네틱 버튼.
     장식보다 콘텐츠 — 남긴 모션은 상태 변화를 설명하는 것들뿐. */

  /* (3) Cell hover preview — built from in-memory data D[y][m][d].
     Only enabled for fine pointer (mouse) — on touch devices, synthetic
     mouseover events make the preview flicker on tap. */
  const FINE_POINTER = matchMedia('(pointer: fine)').matches;
  let _pv = null, _pvTimer = null;
  function getPv(){
    if(_pv) return _pv;
    _pv = document.createElement('div');
    _pv.className = 'cell-preview';
    document.body.appendChild(_pv);
    return _pv;
  }
  function hidePv(){ if(_pv) _pv.classList.remove('in'); }
  function showPvFor(cell){
    const dnEl = cell.querySelector('.dn');
    if(!dnEl) return;
    const dn = parseInt(dnEl.textContent, 10);
    if(!dn) return;
    const dat = (((D[curYear]||{})[cur])||{})[dn];
    const list = (dat && dat.entries) || [];
    if(list.length === 0) return;
    const sorted = list.slice().sort((a,b) => (b.voters.size - a.voters.size) || (a.id - b.id));
    const pv = getPv();
    const dow = DOW_KR[new Date(curYear, cur-1, dn).getDay()];
    pv.innerHTML =
      '<div class="cp-title">'+cur+'월 '+dn+'일 ('+dow+') · '+list.length+'개 후보</div>' +
      sorted.map(e => {
        const v = e.voters.size, my = e.voters.has(MY_VOTER_ID);
        return '<div class="cp-row">' +
          '<span class="cp-dot'+(my?' voted':'')+'"></span>' +
          '<span class="cp-name">'+esc(e.name)+'</span>' +
          (v>0 ? '<span class="cp-count'+(my?' voted':'')+'">👍 '+v+'</span>' : '') +
          '</div>';
      }).join('');
    const r = cell.getBoundingClientRect();
    const pvw = pv.offsetWidth || 280;
    const pvh = pv.offsetHeight || 120;
    let x = r.left + r.width/2 - pvw/2;
    let y = r.top - pvh - 10;
    if(x < 10) x = 10;
    if(x + pvw > innerWidth - 10) x = innerWidth - 10 - pvw;
    if(y < 10) y = r.bottom + 10;
    pv.style.left = x + 'px';
    pv.style.top  = y + 'px';
    requestAnimationFrame(() => pv.classList.add('in'));
  }
  document.addEventListener('mouseover', e => {
    if(!FINE_POINTER) return;
    const cell = e.target.closest('.cell');
    if(!cell || cell.classList.contains('empty') || cell.classList.contains('skeleton')){
      clearTimeout(_pvTimer); hidePv(); return;
    }
    clearTimeout(_pvTimer);
    _pvTimer = setTimeout(() => showPvFor(cell), 420);
  });
  document.addEventListener('mouseout', e => {
    if(!FINE_POINTER) return;
    const from = e.target.closest('.cell');
    const to   = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.cell');
    if(from && from !== to){
      clearTimeout(_pvTimer);
      hidePv();
    }
  });

  /* (4) Confetti + vote-burst */
  let _confettiHost = null;
  function getHost(){
    if(_confettiHost) return _confettiHost;
    _confettiHost = document.createElement('div');
    _confettiHost.className = 'confetti-host';
    document.body.appendChild(_confettiHost);
    return _confettiHost;
  }
  const FOOD_EMOJIS = ['🍜','🍙','🥟','🍣','🍱','🍛','🌮','🍕','🥗','🍰','🍩','🍔','🥪','🍝','🍤','🍲','🥘','🍚'];
  function fireConfetti(el){
    if(REDUCE) return;
    const host = getHost();
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    // Pull live theme colors from CSS vars so confetti tints with the palette.
    const cs = getComputedStyle(document.documentElement);
    const COLORS = [
      cs.getPropertyValue('--accent').trim()    || '#C8553D',
      cs.getPropertyValue('--secondary').trim() || '#588157',
      cs.getPropertyValue('--highlight').trim() || '#F2B441',
      '#D17A8D', '#8E5A8C', '#7C9EF2',
    ];
    const total = 30;
    for(let i = 0; i < total; i++){
      // ~60% food emojis, ~40% color rects — keeps the rainbow burst alive
      // but flips the character into a clearly food-themed celebration.
      const isEmoji = Math.random() < 0.6;
      const p = document.createElement('div');
      if(isEmoji){
        p.className = 'confetti-emoji';
        p.textContent = FOOD_EMOJIS[Math.floor(Math.random()*FOOD_EMOJIS.length)];
      } else {
        p.className = 'confetti-piece';
        p.style.background = COLORS[i % COLORS.length];
      }
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';
      const angle = (i / total) * Math.PI * 2 + Math.random()*0.6;
      const dist  = 140 + Math.random()*140;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 40;
      p.style.setProperty('--cx', dx + 'px');
      p.style.setProperty('--cy', dy + 'px');
      p.style.setProperty('--cr', ((Math.random()-.5)*1440) + 'deg');
      p.style.animationDelay = (Math.random()*0.12) + 's';
      host.appendChild(p);
      setTimeout(() => p.remove(), 2000);
    }
  }
  // Steam wisps rising above the winner card — food-themed "갓 만든 점심" vibe.
  function spawnSteam(el){
    if(REDUCE) return;
    const host = getHost();
    const r = el.getBoundingClientRect();
    const baseX = r.left + r.width/2;
    const baseY = r.top + 6;
    for(let i = 0; i < 5; i++){
      const w = document.createElement('div');
      w.className = 'steam-wisp';
      const off = (i - 2) * 10 + (Math.random()-0.5)*8;
      w.style.left = (baseX + off) + 'px';
      w.style.top  = baseY + 'px';
      w.style.setProperty('--sx', (off*1.4 + (Math.random()-0.5)*22) + 'px');
      w.style.animationDelay = (i * 0.11 + Math.random()*0.06) + 's';
      host.appendChild(w);
      setTimeout(() => w.remove(), 2400);
    }
  }
  // Wrap rollDice so we can fire confetti + steam after the winner reveals
  const _rollDiceOrig = rollDice;
  rollDice = function(){
    _rollDiceOrig.apply(this, arguments);
    setTimeout(() => {
      const w = document.querySelector('.hero-row.dice-winner, .today-leader.dice-winner, .today-row.dice-winner');
      if(w){ spawnSteam(w); fireConfetti(w); }
    }, 1700);
  };

  function spawnVoteBurst(btn){
    if(REDUCE) return;
    const r = btn.getBoundingClientRect();
    const host = getHost();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    for(let i = 0; i < 8; i++){
      const p = document.createElement('div');
      p.className = 'vote-burst';
      p.style.left = (cx - 2.5) + 'px';
      p.style.top  = (cy - 2.5) + 'px';
      const angle = -Math.PI/2 + (i - 3.5) * 0.32;
      const dist = 26 + Math.random()*16;
      p.style.setProperty('--bx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--by', Math.sin(angle)*dist + 'px');
      p.style.animationDelay = (i*0.03) + 's';
      host.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }
  }
  document.addEventListener('click', e => {
    const btn = e.target.closest && e.target.closest('.evote, .hero-vote');
    if(!btn) return;
    // burst only when transitioning INTO voted
    setTimeout(() => { if(btn.classList.contains('voted')) spawnVoteBurst(btn); }, 60);
  });

  // Click ripple on the dice button — radial flare originating from the
  // cursor. Respects reduced motion via the global keyframes override.
  document.addEventListener('pointerdown', e => {
    const btn = e.target.closest && e.target.closest('.dice-btn');
    if(!btn || btn.disabled) return;
    const r = btn.getBoundingClientRect();
    btn.style.setProperty('--rx', (e.clientX - r.left) + 'px');
    btn.style.setProperty('--ry', (e.clientY - r.top)  + 'px');
    btn.classList.remove('ripple');
    void btn.offsetWidth; // restart animation
    btn.classList.add('ripple');
    setTimeout(() => btn.classList.remove('ripple'), 600);
  });

  /* (5) Modal opens FROM clicked cell — transform-origin 을 클릭 지점으로.
     Geist 모션: 300ms 이하, 짧고 물리적인 스케일 인만 남긴다. */
  let _lastXY = null;
  document.addEventListener('click', e => {
    if(e.target.closest('.cell, .hero-row, .more-lnk, .add-btn-ghost, .today-leader, .today-row, .ti-add, .dinner-banner, .dinner-tag, .help-btn, [data-twk-dinner-open]')){
      _lastXY = { x: e.clientX, y: e.clientY };
    }
  }, true);

  // Shared open animation — lunch/dinner/help 모달이 같은 방식으로 진입.
  function animateModalOpen(){
    requestAnimationFrame(() => {
      const m = document.querySelector('.modal');
      if(!m) return;
      if(_lastXY){
        const r = m.getBoundingClientRect();
        const ox = _lastXY.x - r.left;
        const oy = _lastXY.y - r.top;
        m.style.transformOrigin = ox + 'px ' + oy + 'px';
      }
      const openAnim = m.animate([
        { opacity: 0, transform: 'scale(0.95) translateY(8px)' },
        { opacity: 1, transform: 'scale(1) translateY(0)' }
      ], {
        duration: 280,
        easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.1)'
      });
      openAnim.onfinish = () => {
        m.style.transformOrigin = '50% 50%';
      };
    });
  }

  const _openModalOrig = openModal;
  openModal = function(dn){
    _openModalOrig.apply(this, arguments);
    animateModalOpen();
  };
  const _openDinnerModalOrig = openDinnerModal;
  openDinnerModal = function(){
    _openDinnerModalOrig.apply(this, arguments);
    animateModalOpen();
  };
  const _openHelpOrig = openHelp;
  openHelp = function(){
    _openHelpOrig.apply(this, arguments);
    animateModalOpen();
  };

  const _closeModOrig = closeMod;
  closeMod = function(ev, ov){
    // backdrop click guard
    if(ev && ov && ev.target !== ov) return;
    const mw = document.getElementById('mw');
    if(!mw) return;
    const bd = mw.querySelector('.backdrop');
    const m  = mw.querySelector('.modal');
    if(!bd || !m){ return _closeModOrig.apply(this, arguments); }

    bd.classList.add('closing');
    // Cancel any running animations on the modal (a still-running open
    // animation, or a leftover one from before) so this close starts from a
    // clean transform stack and isn't visually absorbed by them.
    if(typeof m.getAnimations === 'function'){
      m.getAnimations().forEach(a => { try { a.cancel(); } catch(e){} });
    }
    // Close animation — 짧게 접히는 스케일 아웃.
    const anim = m.animate([
      { opacity: 1, transform: 'scale(1) translateY(0)' },
      { opacity: 0, transform: 'scale(0.97) translateY(4px)' }
    ], {
      duration: 200,
      easing: 'cubic-bezier(.45, .05, .55, .95)',
      fill: 'forwards'
    });
    // Only clear mw if this closing backdrop still owns it — if the user
    // opened another modal (help/dinner/cell) within the close animation
    // window, wiping innerHTML here would silently kill the new modal.
    const finalizeClose = () => {
      if(!mw.contains(bd)) return;
      mw.innerHTML = '';
      openDay = null; helpOpen = false; openDinnerId = null;
      document.body.classList.remove('modal-open');
    };
    anim.onfinish = finalizeClose;
    // Safety net — if onfinish doesn't fire (e.g. WAA bug), clean up anyway.
    setTimeout(finalizeClose, 320);
  };

  // Expose confetti (dinner dice) + modal-open animation (dinner scheduler).
  window._fireConfetti = fireConfetti;
  window._animateModalOpen = animateModalOpen;

  /* (6) Tip rotator — only when there are no records this month */
  const TIPS = [
    '🎲 골라줘 버튼은 후보 중에서 무작위로 뽑아요',
    '⌨️ ← → 키로 달 이동 · T 또는 Home 으로 오늘로',
    '🌙 D 키로 다크 모드 바로 토글',
    '👥 한 사람당 항목별 1표 · 한 디바이스 = 1명',
    '📌 매달 마지막 금요일은 자동으로 공동휴무 표시',
  ];
  let _tipIdx = 0, _tipTimer = null;
  function refreshTip(){
    const n = document.getElementById('notice');
    if(!n) return;
    const dat = ((D[curYear]||{})[cur])||{};
    const cnt = Object.values(dat).reduce((s,d)=>s+(d.entries||[]).length, 0);
    if(cnt > 0){
      // entries exist — stop rotating; render() already showed the count.
      if(_tipTimer){ clearInterval(_tipTimer); _tipTimer = null; }
      return;
    }
    n.innerHTML = '<span class="tip-rotator"><span class="tip" key="'+_tipIdx+'">'+TIPS[_tipIdx]+'</span></span>';
    _tipIdx = (_tipIdx + 1) % TIPS.length;
    if(!_tipTimer) _tipTimer = setInterval(refreshTip, 5500);
  }
  // First tick after boot; refreshTip itself (re)installs the interval as needed.
  setTimeout(refreshTip, 600);

})();

/* ============================================================
   Tweaks panel — palette / font / dark mode picker (bottom-right)
   The pre-paint script at the top of <head> already restored saved
   prefs to <html data-palette> / data-font / data-theme. This block
   just renders the live picker UI.
   ============================================================ */
(function tweaksInit(){
  const PALETTES = [
    { id: 'buttercream', label: '살구',       colors: ['#d0603c', '#6d9a6b', '#e0a23e', '#f6f1e9'] },
    { id: 'mango',       label: '라떼',       colors: ['#8a5638', '#5e8b7e', '#c99248', '#f2ece2'] },
    { id: 'forest',      label: '피스타치오', colors: ['#5c8a4e', '#c07850', '#d4b04a', '#eff3e5'] },
    { id: 'linen',       label: '베리',       colors: ['#9d4a78', '#c76b85', '#dd9452', '#f4eef5'] },
    { id: 'midnight',    label: '잉크',       colors: ['#3b5ba5', '#d97757', '#d9a83c', '#edf0f5'] },
    { id: 'sakura',      label: '로즈',       colors: ['#d25577', '#7a9464', '#df9f50', '#f9f0eb'] },
  ];
  const FONTS = [
    { id: 'default', label: '기본' },
    { id: 'hahmlet', label: '함렛' },
    { id: 'batang',  label: '바탕' },
    { id: 'song',    label: '송명' },
    { id: 'dodum',   label: '돋움' },
  ];
  const LAYOUTS = [
    { id: 'stacked', label: '상단 카드' },
    { id: 'sidebar', label: '사이드바' },
  ];

  function getState(){
    const root = document.documentElement;
    const body = document.getElementById('windowBody');
    return {
      palette: root.getAttribute('data-palette') || 'buttercream',
      font:    root.getAttribute('data-font')    || 'default',
      layout:  (body && body.getAttribute('data-layout')) || 'sidebar',
      dark:    (root.getAttribute('data-theme') === 'dark'),
    };
  }
  function setState(part){
    const root = document.documentElement;
    if(part.palette){
      root.setAttribute('data-palette', part.palette);
      try { localStorage.setItem('gtl-palette', part.palette); } catch(e){}
      if(typeof syncThemeColor === 'function') syncThemeColor();
    }
    if(part.font){
      root.setAttribute('data-font', part.font);
      try { localStorage.setItem('gtl-font', part.font); } catch(e){}
    }
    if(part.layout){
      try { localStorage.setItem('gtl-layout', part.layout); } catch(e){}
      root.setAttribute('data-layout', part.layout);
      if(typeof applyLayout === 'function') applyLayout(part.layout);
    }
    if(typeof part.dark === 'boolean'){
      const t = part.dark ? 'dark' : 'light';
      try { localStorage.setItem('gtl-theme', t); } catch(e){}
      document.documentElement.classList.add('theme-switching');
      applyTheme(t);
      setTimeout(() => document.documentElement.classList.remove('theme-switching'), 600);
    }
    renderTweaks();
  }

  function renderTweaks(){
    const root = document.getElementById('tweaksRoot');
    if(!root) return;
    const panel = root.querySelector('.twk-panel');
    if(!panel) return;
    panel.innerHTML = panelHTML(getState());
    bindPanel();
  }

  // 회식 섹션 — 자주 없는 일정이라 메인 UI 대신 설정 안에서 날짜를 잡는다.
  function dinnerSectionHTML(){
    let inner;
    if(!_loaded){
      inner = '<div class="twk-hint">데이터를 불러오는 중…</div>';
    } else if(!_dinnerReady){
      inner = '<div class="twk-hint">회식 기능을 켜려면 Supabase SQL Editor 에서 <b>supabase/schema.sql</b> 을 한 번 더 실행해주세요.</div>';
    } else {
      const ups = getUpcomingDinners();
      const rows = ups.map(function(d){
        const dow = DOW_KR[new Date(d.year, d.month-1, d.day).getDay()];
        const dd = dinnerDday(d);
        return '<div class="twk-dinner-row">'+
          '<span style="flex-shrink:0">🍻</span>'+
          '<span class="tdr-date">'+d.month+'/'+d.day+' ('+dow+')'+(d.title?' · '+esc(d.title):'')+
            (dd?' <b style="color:var(--accent)">'+dd+'</b>':'')+
          '</span>'+
          '<button class="tdr-btn primary" type="button" data-twk-dinner-open="'+d.id+'">장소</button>'+
          '<button class="tdr-btn danger" type="button" data-twk-dinner-del="'+d.id+'" aria-label="회식 취소" title="회식 취소"><i class="ti ti-trash" style="font-size:12px"></i></button>'+
        '</div>';
      }).join('');
      inner =
        (rows ? '<div class="twk-dinner-list">'+rows+'</div>' : '')+
        '<button class="twk-btn-wide" type="button" data-twk-dinner-create><i class="ti ti-calendar-plus" style="font-size:14px"></i>회식 날짜 잡기</button>'+
        (rows ? '' : '<div class="twk-hint" style="margin-top:6px">캘린더에서 날짜를 고르면 🍻 배지와 장소 투표 화면이 생겨요.</div>');
    }
    return '<div class="twk-section">'+
      '<div class="twk-section-title">🍻 회식</div>'+inner+
    '</div>';
  }

  function panelHTML(s){
    return ''+
      '<div class="twk-head">'+
        '<div class="twk-title"><i class="ti ti-settings"></i>설정</div>'+
        '<button class="twk-close" type="button" data-twk-act="close" aria-label="닫기"><i class="ti ti-x" style="font-size:16px"></i></button>'+
      '</div>'+
      '<div class="twk-body">'+
        dinnerSectionHTML()+
        '<div class="twk-section">'+
          '<div class="twk-section-title">레이아웃</div>'+
          '<div class="twk-radio">'+
            LAYOUTS.map(function(l){
              return '<button type="button" class="'+(s.layout===l.id?'on':'')+'" data-twk-layout="'+l.id+'">'+l.label+'</button>';
            }).join('')+
          '</div>'+
        '</div>'+
        '<div class="twk-section">'+
          '<div class="twk-section-title">컬러 팔레트</div>'+
          '<div class="palette-chips">'+
            PALETTES.map(function(p){
              return '<button class="palette-chip'+(s.palette===p.id?' on':'')+'" type="button" data-twk-pal="'+p.id+'" title="'+p.label+'">'+
                '<div class="pc-stripes">'+
                  p.colors.map(function(c){ return '<span style="background:'+c+'"></span>'; }).join('')+
                '</div>'+
                '<div class="pc-label">'+p.label+'</div>'+
                (s.palette===p.id ? '<div class="pc-check"><svg viewBox="0 0 12 12" width="9" height="9"><path d="M2.5 6.2 5 8.4 9.5 3.6" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' : '')+
              '</button>';
            }).join('')+
          '</div>'+
        '</div>'+
        '<div class="twk-section">'+
          '<div class="twk-section-title">제목 폰트</div>'+
          '<div class="twk-radio">'+
            FONTS.map(function(f){
              return '<button type="button" class="'+(s.font===f.id?'on':'')+'" data-twk-font="'+f.id+'">'+f.label+'</button>';
            }).join('')+
          '</div>'+
        '</div>'+
        '<div class="twk-section">'+
          '<div class="twk-section-title">모드</div>'+
          '<div class="twk-toggle'+(s.dark?' on':'')+'" data-twk-act="dark" role="button" tabindex="0">'+
            '<div class="label"><i class="ti '+(s.dark?'ti-moon':'ti-sun')+'"></i>다크 모드</div>'+
            '<div class="twk-switch"></div>'+
          '</div>'+
        '</div>'+
      '</div>';
  }

  function bindPanel(){
    const root = document.getElementById('tweaksRoot');
    if(!root) return;
    const panel = root.querySelector('.twk-panel');
    if(!panel) return;
    panel.querySelectorAll('[data-twk-pal]').forEach(function(btn){
      btn.addEventListener('click', function(){ setState({ palette: btn.getAttribute('data-twk-pal') }); });
    });
    panel.querySelectorAll('[data-twk-font]').forEach(function(btn){
      btn.addEventListener('click', function(){ setState({ font: btn.getAttribute('data-twk-font') }); });
    });
    panel.querySelectorAll('[data-twk-layout]').forEach(function(btn){
      btn.addEventListener('click', function(){ setState({ layout: btn.getAttribute('data-twk-layout') }); });
    });
    panel.querySelectorAll('[data-twk-act="dark"]').forEach(function(el){
      el.addEventListener('click', function(){ setState({ dark: !getState().dark }); });
      el.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setState({ dark: !getState().dark }); }
      });
    });
    panel.querySelectorAll('[data-twk-act="close"]').forEach(function(el){
      el.addEventListener('click', closeTweaks);
    });
    panel.querySelectorAll('[data-twk-dinner-open]').forEach(function(btn){
      btn.addEventListener('click', function(){
        const id = +btn.getAttribute('data-twk-dinner-open');
        closeTweaks();
        openDinnerModal(id);
      });
    });
    panel.querySelectorAll('[data-twk-dinner-del]').forEach(function(btn){
      btn.addEventListener('click', function(){
        onDeleteDinnerClick(+btn.getAttribute('data-twk-dinner-del'));
      });
    });
    panel.querySelectorAll('[data-twk-dinner-create]').forEach(function(btn){
      btn.addEventListener('click', openDinnerScheduler);
    });
  }

  function openTweaks(){
    const root = document.getElementById('tweaksRoot');
    if(!root || root.querySelector('.twk-panel')) return;
    const panel = document.createElement('div');
    panel.className = 'twk-panel';
    panel.innerHTML = panelHTML(getState());
    // Stop clicks inside the panel from bubbling to outsideClick. Without this,
    // re-rendering the panel HTML on a chip click removes the original target
    // from the DOM, breaking the `.closest('.twk-panel')` guard in outsideClick
    // and causing the panel to close on every selection.
    panel.addEventListener('click', function(e){ e.stopPropagation(); });
    root.appendChild(panel);
    bindPanel();
    const fab = document.getElementById('settingsFab');
    if(fab) fab.style.display = 'none';
    // Outside click + ESC close (deferred so the opening click itself doesn't close)
    setTimeout(function(){
      document.addEventListener('click', outsideClick);
      document.addEventListener('keydown', escClose);
    }, 0);
  }
  function closeTweaks(){
    const root = document.getElementById('tweaksRoot');
    const panel = root && root.querySelector('.twk-panel');
    if(!panel) return;
    panel.classList.add('closing');
    document.removeEventListener('click', outsideClick);
    document.removeEventListener('keydown', escClose);
    setTimeout(function(){
      panel.remove();
      const fab = document.getElementById('settingsFab');
      if(fab) fab.style.display = '';
    }, 180);
  }
  function outsideClick(e){
    if(e.target.closest('.twk-panel')) return;
    if(e.target.closest('#settingsFab') || e.target.closest('.title-grip')) return;
    closeTweaks();
  }
  function escClose(e){
    if(e.key === 'Escape') closeTweaks();
  }

  window.openTweaks = openTweaks;
  window.closeTweaks = closeTweaks;
  // 회식 데이터가 바뀌면 (생성/취소 echo) 열려 있는 패널 내용을 갱신
  window._refreshTweaks = renderTweaks;
})();

/* ---------- boot ---------- */
(async () => {
  // theme: render theme icon based on the already-applied attribute
  applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
  // Apply the saved layout to .window-body (pre-paint stashed it on <html>)
  const savedLayout = document.documentElement.getAttribute('data-layout') || 'sidebar';
  applyLayout(savedLayout);

  MY_VOTER_ID = getOrMakeVoterId();
  renderTabs();
  renderHero();
  renderSidebarHero();
  render(true);
  updateNavButtons();

  sb = initSupabase();
  if(!sb) return;
  await loadAll();
  subscribe();
  subscribeDinners();
})();
</script>
</body>
</html>
